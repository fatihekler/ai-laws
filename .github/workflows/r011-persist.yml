          section='''\n### R011 — Human sovereignty comparative rights baseline\n\nR011 established a selected-source comparative map for dignity, mental integrity, privacy/data protection, manipulation/vulnerability exploitation, biometric/emotion inference, automated-decision safeguards, contestability/remedies, and Chile-specific brain-activity protection. It does not create a universal named cognitive-liberty right.\n\n```text\nR011_CONTROLLED_SOURCE_RECORDS = 8\nR011_EU_BINDING_PRIMARY_SOURCES = 3\nR011_CHILE_BINDING_PRIMARY_SOURCE_ANCHORS = 1\nR011_CETS225_TREATY_STATUS_GATE = R004_NOT_TREATY_WIDE_IN_FORCE\nR011_UNESCO_SOFT_LAW_SOURCES = 2\nR011_CL002_CASE_LAW_ADMISSION = BLOCKED\nR011_SELECTED_EU_EXACT_COGNITIVE_LIBERTY_TERM_COUNT = 0\nR011_UNIVERSAL_COGNITIVE_LIBERTY_RIGHT = NOT_INFERRED\nR011_NEW_SOURCE_BINARY_DOWNLOADS = 0\nR011_NOTEBOOK_UPLOADS = 0\nR011_LIABILITY_CONCLUSION = NOT_ATTEMPTED\n```\n\nDurable outputs are under `50_RIGHTS/` plus `95_RESEARCH/RIGHTS/AI-LAWS-R011_CLOSEOUT_2026-09-14.md`.\n\n`DIRECT_NEURAL_OR_BRAIN_ACTIVITY_DATA != ORDINARY_BEHAVIOURAL_INFERENCE`, `SELECTED_SOURCE_TERM_NOT_FOUND != UNIVERSAL_RIGHT_DOES_NOT_EXIST`, and `OFFICIAL_DOCKET_IDENTITY != FULL_TEXT_VERIFIED` remain controlling boundaries.\n'''
          if '### R011 — Human sovereignty comparative rights baseline' not in ctx:
              marker='\n### R021'
              assert marker in ctx
              ctx=ctx.replace(marker,section+marker,1)
          integrity='''R011_CONTROLLED_SOURCE_RECORDS = 8\nR011_CL002_CASE_LAW_ADMISSION = BLOCKED\nR011_UNIVERSAL_COGNITIVE_LIBERTY_RIGHT = NOT_INFERRED\nR011_NEW_SOURCE_BINARY_DOWNLOADS = 0\nR011_NOTEBOOK_UPLOADS = 0\nR011_LIABILITY_CONCLUSION = NOT_ATTEMPTED\n'''
          if 'R011_CONTROLLED_SOURCE_RECORDS = 8' not in ctx[ctx.find('## 10. Current integrity state'):]:
              marker='NOTEBOOK_UPLOAD_COUNT = 0\n'
              assert marker in ctx
              ctx=ctx.replace(marker,integrity+marker,1)
          cpath.write_text(ctx.rstrip()+"\n",encoding='utf-8')

          print('R011_DURABLE_GENERATION=PASS')
          print('ZIP_OR_ARTIFACT_CREATED=NO')
          print('NEW_SOURCE_BINARY_DOWNLOADS=0')
          print('DERIVED_MARKDOWN_CREATED=0')
          print('NOTEBOOK_UPLOADS=0')
          print('AUTO_ADVANCE=NO')
