name: AI-LAWS R007 Utah current-version detail probe

on:
  push:
    paths:
      - '.github/workflows/r007-us-state-detail-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Resolve Utah current-version body
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request,re
          urls=[
            'https://le.utah.gov/xcode/Title13/Chapter72/C13-72-S101_2026050620260506.html',
            'https://le.utah.gov/xcode/Title13/Chapter72/13-72-S101_bills.html',
          ]
          for u in urls:
              print('\nURL=',u)
              req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0 AI-LAWS-R007'})
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      b=r.read(); t=b.decode('utf-8','ignore')
                      print('FINAL=',r.geturl(),'STATUS=',r.status,'TYPE=',r.headers.get('content-type'),'BYTES=',len(b))
                      print('TITLE=',re.findall(r'<title[^>]*>(.*?)</title>',t,re.I|re.S)[:1])
                      clean=re.sub(r'<[^>]+>',' ',t); clean=re.sub(r'\s+',' ',clean)
                      for pat in ['Effective 5/6/2026','Effective','Artificial Intelligence Policy Act','13-72-101','Definitions','generative artificial intelligence','HB 452','2026']:
                          i=clean.lower().find(pat.lower())
                          print(pat,'FOUND=',i>=0,'SAMPLE=',clean[max(0,i-180):i+500] if i>=0 else '')
              except Exception as e:
                  print('ERROR=',type(e).__name__,str(e))
          PY
          echo 'ZIP_OR_ARTIFACT_CREATED=NO'
