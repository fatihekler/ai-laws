name: AI-LAWS R009 persist UK sectoral baseline

on:
  push:
    paths:
      - '.github/workflows/r009-persist.yml'

permissions:
  contents: write

jobs:
  persist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fresh drift gate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          HEAD_SHA="$(git rev-parse HEAD)"
          ORIGIN_SHA="$(git rev-parse origin/main)"
          echo "HEAD_SHA=$HEAD_SHA"
          echo "ORIGIN_SHA=$ORIGIN_SHA"
          test "$HEAD_SHA" = "$ORIGIN_SHA"
          echo 'R009_DRIFT_GATE=PASS'
      - name: Generate controlled R009 durable state
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/r009_persist.py
      - name: Normalize generated Markdown
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/[[:space:]]\+$//' 20_JURISDICTIONS/GB/GB_AI_DATA_ONLINE_SAFETY_PRODUCT_REGULATORY_MAP_2026-09-14.md
          sed -i 's/[[:space:]]\+$//' 95_RESEARCH/GB/AI-LAWS-R009_CLOSEOUT_2026-09-14.md
          echo 'R009_MARKDOWN_NORMALIZATION=PASS'
      - name: Validate R009 durable state
        shell: bash
        run: |
          set -euo pipefail
          test -f 20_JURISDICTIONS/GB/GB_AI_DATA_ONLINE_SAFETY_PRODUCT_REGULATORY_MAP_2026-09-14.md
          test -f 20_JURISDICTIONS/GB/GB_PRIMARY_SOURCE_INVENTORY_2026-09-14.csv
          test -f 20_JURISDICTIONS/GB/GB_CURRENTNESS_AND_BINDING_STATE_MATRIX.csv
          test -f 95_RESEARCH/GB/AI-LAWS-R009_CLOSEOUT_2026-09-14.md
          test "$(grep -c '^GB-0' 20_JURISDICTIONS/GB/GB_PRIMARY_SOURCE_INVENTORY_2026-09-14.csv)" -eq 13
          grep -q '^AI-LAWS-R009,P1,United Kingdom,.*COMPLETE_RESEARCH_BASELINE_L1_L2_SECTORAL_MAP_CURRENTNESS_OPEN' 90_RESEARCH_QUEUE/INITIAL_RESEARCH_QUEUE.csv
          grep -q '^GB,United Kingdom,NATIONAL,EUROPE,SECTORAL_AI_DATA_ONLINE_SAFETY_PRODUCT_L1_L2_BASELINE_COMPLETE_SECTION_LEVEL_CURRENTNESS_OPEN' 20_JURISDICTIONS/JURISDICTION_RESEARCH_REGISTRY.csv
          grep -q '^NB05,GB-013,' 86_NOTEBOOKLM/NOTEBOOKLM_SOURCE_PACK_ASSIGNMENTS.csv
          grep -q '^NB-BATCH-NB05-20260914-002,GB-013,' 86_NOTEBOOKLM/NOTEBOOKLM_ACQUISITION_AND_VALIDATION_LEDGER.csv
          grep -q 'OFCOM_ONLINE_SAFETY_HUB = HTTP_403_GITHUB_RUNNER' 95_RESEARCH/GB/AI-LAWS-R009_CLOSEOUT_2026-09-14.md
          grep -q 'ZIP_OR_ARTIFACT_CREATED = NO' 95_RESEARCH/GB/AI-LAWS-R009_CLOSEOUT_2026-09-14.md
          echo 'R009_DURABLE_VALIDATION=PASS'
      - name: Commit and push R009 durable outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            20_JURISDICTIONS/GB \
            95_RESEARCH/GB \
            20_JURISDICTIONS/JURISDICTION_RESEARCH_REGISTRY.csv \
            90_RESEARCH_QUEUE/INITIAL_RESEARCH_QUEUE.csv \
            00_CONTROL/CURRENT_CONTEXT_AND_NEXT_ACTION.md \
            86_NOTEBOOKLM/NOTEBOOKLM_SOURCE_ACQUISITION_MANIFEST.csv \
            86_NOTEBOOKLM/NOTEBOOKLM_SOURCE_PACK_ASSIGNMENTS.csv \
            86_NOTEBOOKLM/NOTEBOOKLM_ACQUISITION_AND_VALIDATION_LEDGER.csv \
            86_NOTEBOOKLM/NOTEBOOKLM_DOWNLOAD_AND_UPLOAD_LIST.md
          git diff --cached --check
          git status --short
          git commit -m 'research(r009): establish UK sectoral regulatory baseline'
          git push origin HEAD:main
      - name: Confirm controlled stop
        shell: bash
        run: |
          set -euo pipefail
          echo 'ZIP_OR_ARTIFACT_CREATED=NO'
          echo 'NOTEBOOK_UPLOADS=0'
          echo 'NEW_BINARY_DOWNLOADS=0'
          echo 'AUTO_ADVANCE=NO'
          echo 'STOP=YES'
