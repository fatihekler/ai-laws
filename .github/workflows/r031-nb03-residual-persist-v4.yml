name: AI-LAWS R031 NB03 residual durable state v4

on:
  push:
    paths:
      - '.github/workflows/r031-nb03-residual-persist-v4.yml'

permissions:
  contents: write

jobs:
  persist:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Persist verified R031 state
        run: python3 .github/scripts/r031_persist_v3.py
      - name: Normalize closeout whitespace
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/[[:space:]]\+$//' 86_NOTEBOOKLM/acquisition_runs/AI-LAWS-R031_NB03_RESIDUAL_SOURCE_VALIDATION_CLOSEOUT_2026-09-14.md
      - name: Commit durable state
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 00_CONTROL/CURRENT_CONTEXT_AND_NEXT_ACTION.md \
                  86_NOTEBOOKLM/NOTEBOOKLM_ACQUISITION_AND_VALIDATION_LEDGER.csv \
                  86_NOTEBOOKLM/NOTEBOOKLM_DOWNLOAD_AND_UPLOAD_LIST.md \
                  86_NOTEBOOKLM/downloads/DOWNLOADS_REGISTRY.csv \
                  86_NOTEBOOKLM/downloads/NB03_CONTENT_IDENTITY_RESULTS.csv \
                  86_NOTEBOOKLM/downloads/NB03_RESIDUAL_VERIFICATION_RESULTS.csv \
                  86_NOTEBOOKLM/downloads/NOTEBOOK_UPLOAD_PLAN.md \
                  86_NOTEBOOKLM/acquisition_runs/AI-LAWS-R031_NB03_RESIDUAL_SOURCE_VALIDATION_CLOSEOUT_2026-09-14.md \
                  90_RESEARCH_QUEUE/INITIAL_RESEARCH_QUEUE.csv
          git diff --cached --check
          git diff --cached --quiet && { echo 'NO_DURABLE_CHANGES'; exit 1; }
          git commit -m 'validation(r031): persist NB03 residual source verification'
          git push origin HEAD:main
      - name: Confirm no artifact
        run: |
          echo 'ZIP_OR_ARTIFACT_CREATED=NO'
          echo 'NOTEBOOK_UPLOADS=0'
          echo 'AUTO_ADVANCE=NO'
