name: AI-LAWS R026 NB04 durable state v2

on:
  push:
    paths:
      - '.github/workflows/r026-nb04-durable-state-v2.yml'

permissions:
  contents: write

jobs:
  write-state:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Execute deterministic R026 state generator
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, textwrap
          workflow = Path('.github/workflows/r026-nb04-durable-state.yml').read_text(encoding='utf-8')
          m = re.search(r"python3 - <<'PY'\n(.*?)\n          PY", workflow, flags=re.S)
          if not m:
              raise SystemExit('embedded R026 generator not found')
          script = textwrap.dedent(m.group(1))
          exec(compile(script, 'r026-generator', 'exec'), {})

          # Normalize generated CSV files to LF so validation is deterministic.
          csv_paths = [
              Path('86_NOTEBOOKLM/downloads/NB04_CONTENT_IDENTITY_RESULTS.csv'),
              Path('86_NOTEBOOKLM/downloads/DOWNLOADS_REGISTRY.csv'),
              Path('86_NOTEBOOKLM/NOTEBOOKLM_ACQUISITION_AND_VALIDATION_LEDGER.csv'),
              Path('90_RESEARCH_QUEUE/INITIAL_RESEARCH_QUEUE.csv'),
          ]
          for p in csv_paths:
              data = p.read_text(encoding='utf-8')
              p.write_text(data.replace('\r\n','\n').replace('\r','\n'), encoding='utf-8')

          # Fail closed on expected durable outputs and key state assertions.
          results = Path('86_NOTEBOOKLM/downloads/NB04_CONTENT_IDENTITY_RESULTS.csv').read_text(encoding='utf-8')
          if results.count('\nTR-') != 8:
              raise SystemExit('NB04 results row-count mismatch')
          if 'TR-008,SİBER GÜVENLİK KANUNU.pdf' not in results or '7590_INCLUDED' not in results:
              raise SystemExit('TR-008 7590 durable state missing')
          queue = Path('90_RESEARCH_QUEUE/INITIAL_RESEARCH_QUEUE.csv').read_text(encoding='utf-8')
          if 'AI-LAWS-R026' not in queue or 'PARTIAL_SOURCE_PIN_REPOSITORY_PDF_CONTENT_VERIFIED_OFFICIAL_LIVE_RECHECK_BLOCKED' not in queue:
              raise SystemExit('queue assertions failed')
          ledger = Path('86_NOTEBOOKLM/NOTEBOOKLM_ACQUISITION_AND_VALIDATION_LEDGER.csv').read_text(encoding='utf-8')
          if ledger.count('NB-BATCH-NB04-20260914-002') != 8:
              raise SystemExit('ledger R026 row-count mismatch')
          PY

      - name: Commit R026 durable state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 86_NOTEBOOKLM/downloads/NB04_CONTENT_IDENTITY_RESULTS.csv \
                  86_NOTEBOOKLM/downloads/DOWNLOADS_REGISTRY.csv \
                  86_NOTEBOOKLM/NOTEBOOKLM_ACQUISITION_AND_VALIDATION_LEDGER.csv \
                  86_NOTEBOOKLM/downloads/NOTEBOOK_UPLOAD_PLAN.md \
                  90_RESEARCH_QUEUE/INITIAL_RESEARCH_QUEUE.csv \
                  86_NOTEBOOKLM/acquisition_runs/AI-LAWS-R026_NB04_REPOSITORY_PDF_VALIDATION_CLOSEOUT_2026-09-14.md \
                  00_CONTROL/CURRENT_CONTEXT_AND_NEXT_ACTION.md
          git diff --cached --stat
          git commit -m 'validation(r026): persist NB04 repository PDF verification'
          git push origin HEAD:main
