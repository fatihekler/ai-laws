name: AI-LAWS R029 NB08 deep source resolver

on:
  push:
    paths:
      - '.github/workflows/r029-nb08-deep-resolve.yml'

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Resolve OpenAI and METR original links
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv, hashlib, html, re, subprocess, urllib.parse
          from pathlib import Path
          d=Path('86_NOTEBOOKLM/downloads')
          with (d/'DOWNLOADS_REGISTRY.csv').open(newline='',encoding='utf-8') as f:
              reg={r['manifest_source_id']:r for r in csv.DictReader(f) if r['manifest_source_id'] in {'INC-001','INC-002'}}
          def run(cmd): return subprocess.check_output(cmd,text=True,errors='replace')
          def get(url,name):
              out=Path('/tmp')/name
              cmd=['curl','-L','--silent','--show-error','--fail-with-body','--connect-timeout','15','--max-time','90','--retry','1','-A','Mozilla/5.0 AI-LAWS source verification','-o',str(out),'-w','%{http_code}|%{content_type}|%{url_effective}',url]
              try:
                  meta=run(cmd).strip(); return meta,out.read_bytes(),out
              except subprocess.CalledProcessError as e:
                  return f'FAILED:{e.returncode}',b'',out
          def relevant(raw,base):
              out=[]
              for href in re.findall(r'href=["\']([^"\']+)["\']',raw,flags=re.I):
                  u=urllib.parse.urljoin(base,html.unescape(href))
                  if any(k in u.lower() for k in ['pdf','docs.google','drive.google','download','report','hugging','openai']):
                      if u not in out: out.append(u)
              return out
          
          # OpenAI official URL linked by Redwood/METR.
          ou='https://openai.com/index/hugging-face-model-evaluation-security-incident/'
          om,ob,op=get(ou,'openai-linked.html')
          print('OPENAI_LINKED|url=%s|curl=%s|bytes=%d|sha256=%s' % (ou,om,len(ob),hashlib.sha256(ob).hexdigest() if ob else 'NONE'))
          if ob:
              raw=ob.decode('utf-8','replace'); txt=' '.join(html.unescape(re.sub(r'<[^>]+>',' ',raw)).split())
              print('OPENAI_LINKED_TEXT|title_incident=%s|hugging_face=%s|road_ahead=%s|head=%s' % ('YES' if 'incident' in txt.lower() else 'NO','YES' if 'hugging face' in txt.lower() else 'NO','YES' if 'road ahead' in txt.lower() else 'NO',txt[:1200]))
              for i,u in enumerate(relevant(raw,ou)[:60],1): print('OPENAI_LINK|%02d|%s' % (i,u))
          
          # METR original page and its report/download links.
          mu='https://metr.org/blog/2026-08-26-openai-hugging-face-incident-investigation/'
          mm,mb,mp=get(mu,'metr.html')
          print('METR|url=%s|curl=%s|bytes=%d|sha256=%s' % (mu,mm,len(mb),hashlib.sha256(mb).hexdigest() if mb else 'NONE'))
          links=relevant(mb.decode('utf-8','replace') if mb else '',mu)
          print('METR_RELEVANT_LINK_COUNT|%d' % len(links))
          repo=(d/reg['INC-002']['repo_filename']).read_bytes()
          for i,u in enumerate(links[:80],1):
              print('METR_LINK|%02d|%s' % (i,u))
              if any(k in u.lower() for k in ['.pdf','docs.google','drive.google','download']):
                  m,b,o=get(u,'metr-candidate-%02d'%i)
                  print('METR_CANDIDATE|%02d|curl=%s|bytes=%d|sha256=%s|repo_sha256=%s|exact=%s' % (i,m,len(b),hashlib.sha256(b).hexdigest() if b else 'NONE',hashlib.sha256(repo).hexdigest(),'YES' if b and b==repo else 'NO'))
          PY
      - run: echo 'ZIP_OR_ARTIFACT_CREATED=NO'
