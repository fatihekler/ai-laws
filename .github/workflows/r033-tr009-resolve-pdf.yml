name: AI-LAWS R033 TR-009 resolve current action-plan PDF

on:
  push:
    paths:
      - '.github/workflows/r033-tr009-resolve-pdf.yml'

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils curl file
      - name: Resolve official PDF and verify identity
        shell: bash
        run: |
          set -euo pipefail
          echo "HEAD|$(git rev-parse HEAD)"
          python3 - <<'PY'
          import hashlib, html, re, subprocess, urllib.parse
          from pathlib import Path

          PAGE='https://www.sanayi.gov.tr/plan-program-raporlar-ve-yayinlar/strateji-belgeleri'
          NEWS='https://www.sanayi.gov.tr/medya/haber/turkiye-yapay-zek%C3%A2-eylem-plani-aciklandi'

          def get(url, stem, timeout=60):
              p=Path('/tmp')/stem
              cp=subprocess.run(['curl','-L','--silent','--show-error','--connect-timeout','15','--max-time',str(timeout),'--retry','1','--retry-delay','2','-A','Mozilla/5.0 AI-LAWS source verification','-o',str(p),'-w','%{http_code}|%{content_type}|%{url_effective}',url],text=True,capture_output=True)
              b=p.read_bytes() if p.exists() else b''
              mime='NONE'
              if b:
                  mime=subprocess.check_output(['file','-b','--mime-type',str(p)],text=True,errors='replace').strip()
              print(f'GET|{stem}|url={url}|rc={cp.returncode}|curl={cp.stdout.strip()}|mime={mime}|bytes={len(b)}|sha256={hashlib.sha256(b).hexdigest() if b else "NONE"}')
              return cp.stdout.strip(),b,p,mime

          meta,b,p,mime=get(PAGE,'strategy-page')
          text=b.decode('utf-8','replace')
          visible=' '.join(re.sub(r'<[^>]+>',' ',text).split())
          print(f'PAGE_MARKERS|title={"YES" if "Türkiye Yapay Zekâ Eylem Planı" in visible or "Türkiye Yapay Zeka Eylem Planı" in visible else "NO"}|2026_2030={"YES" if "2026-2030" in visible or "2026 – 2030" in visible else "NO"}')

          links=[]
          base=meta.split('|')[-1] if '|' in meta else PAGE
          for raw in re.findall(r'''href=["']([^"']+)["']''',text,re.I):
              full=urllib.parse.urljoin(base,html.unescape(raw).replace('&amp;','&'))
              low=full.lower()
              if (low.endswith('.pdf') or '.pdf?' in low) and any(k in low for k in ['yapay','zeka','zekâ','eylem','2026','2030']):
                  if full not in links:
                      links.append(full); print('PDF_LINK|'+full)

          # Also inspect all nearby PDF links if the filename is opaque.
          if not links:
              for raw in re.findall(r'''href=["']([^"']+)["']''',text,re.I):
                  full=urllib.parse.urljoin(base,html.unescape(raw).replace('&amp;','&'))
                  if ('.pdf' in full.lower()) and full not in links:
                      links.append(full); print('PDF_LINK_FALLBACK|'+full)

          # Known title-based guesses retained only as fallback verification candidates.
          guesses=[
              'https://www.sanayi.gov.tr/assets/pdf/TurkiyeYapayZekaEylemPlani2026-2030.pdf',
              'https://www.sanayi.gov.tr/assets/pdf/TurkiyeYapayZek%C3%A2EylemPlani2026-2030.pdf',
              'https://www.sanayi.gov.tr/assets/pdf/TurkiyeYapayZekaEylemPlani.pdf',
              'https://www.sanayi.gov.tr/assets/pdf/TurkiyeYapayZek%C3%A2EylemPlani.pdf',
          ]
          for g in guesses:
              if g not in links: links.append(g)

          verified=[]
          for i,u in enumerate(links[:50],1):
              meta2,b2,p2,mime2=get(u,f'pdf-{i}',60)
              if not b2 or mime2!='application/pdf':
                  continue
              try:
                  info=subprocess.check_output(['pdfinfo',str(p2)],text=True,errors='replace')
                  txt=subprocess.check_output(['pdftotext','-layout',str(p2),'-'],text=True,errors='replace')
              except Exception as e:
                  print(f'PDF_PARSE|{i}|ERROR={type(e).__name__}:{e}')
                  continue
              pages=re.search(r'^Pages:\s+(\d+)',info,re.M)
              flat=' '.join(txt.split())
              markers={
                  'title': ('Türkiye Yapay Zekâ Eylem Planı' in txt or 'Türkiye Yapay Zeka Eylem Planı' in txt),
                  '2026_2030': ('2026-2030' in txt or '2026 – 2030' in txt or '2026–2030' in txt),
                  'farket': ('Fark Et' in txt or 'FARK ET' in txt or 'Fark et' in txt),
                  'istifade': ('İstifade Et' in txt or 'İSTİFADE ET' in txt or 'İstifade et' in txt),
                  'uret': ('Üret' in txt or 'ÜRET' in txt),
                  'yonet': ('Yönet' in txt or 'YÖNET' in txt),
              }
              print(f'PDF_ID|{i}|url={u}|final={meta2.split("|")[-1] if "|" in meta2 else u}|pages={pages.group(1) if pages else "UNKNOWN"}|textchars={len(txt)}|markers={markers}|sha256={hashlib.sha256(b2).hexdigest()}|bytes={len(b2)}|head={flat[:1200]}')
              if markers['title'] and markers['2026_2030']:
                  verified.append((u,meta2.split('|')[-1] if '|' in meta2 else u,hashlib.sha256(b2).hexdigest(),len(b2),pages.group(1) if pages else 'UNKNOWN'))

          meta3,b3,p3,mime3=get(NEWS,'news',45)
          v3=' '.join(re.sub(r'<[^>]+>',' ',b3.decode('utf-8','replace')).split()) if b3 else ''
          print(f'NEWS_MARKERS|13_06_2026={"YES" if "13.06.2026" in v3 or "13 Haziran 2026" in v3 else "NO"}|action_plan={"YES" if "Türkiye Yapay Zekâ Eylem Planı" in v3 or "Türkiye Yapay Zeka Eylem Planı" in v3 else "NO"}|four_axes={"YES" if all(x in v3 for x in ["fark et","istifade et","üret","yönet"]) else "NO"}')

          print('VERIFIED_COUNT|'+str(len(verified)))
          for rec in verified:
              print('VERIFIED|url=%s|final=%s|sha256=%s|bytes=%s|pages=%s'%rec)
          print('ZIP_OR_ARTIFACT_CREATED=NO')
          print('REPOSITORY_MUTATION_BY_RESOLVE_JOB=NO')
          PY
