name: AI-LAWS R030 NB02 EU durable PDF validation

on:
  push:
    paths:
      - '.github/workflows/r030-nb02-eu-durable-state.yml'

permissions:
  contents: write

jobs:
  persist:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install verification tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils curl
      - name: Reverify and write R030 durable state
        run: python3 .github/scripts/r030_persist.py
      - name: Commit R030 durable state
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || { echo 'DRIFT_BLOCKER: origin/main moved during R030'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            86_NOTEBOOKLM/downloads/NB02_REPOSITORY_PDF_VALIDATION_RESULTS.csv \
            86_NOTEBOOKLM/downloads/DOWNLOADS_REGISTRY.csv \
            86_NOTEBOOKLM/NOTEBOOKLM_ACQUISITION_AND_VALIDATION_LEDGER.csv \
            86_NOTEBOOKLM/downloads/NOTEBOOK_UPLOAD_PLAN.md \
            86_NOTEBOOKLM/NOTEBOOKLM_DOWNLOAD_AND_UPLOAD_LIST.md \
            86_NOTEBOOKLM/acquisition_runs/AI-LAWS-R030_NB02_REPOSITORY_PDF_VALIDATION_CLOSEOUT_2026-09-14.md \
            90_RESEARCH_QUEUE/INITIAL_RESEARCH_QUEUE.csv \
            00_CONTROL/CURRENT_CONTEXT_AND_NEXT_ACTION.md
          git diff --cached --quiet && { echo 'No durable R030 changes produced'; exit 1; }
          git commit -m 'validation(r030): persist NB02 official PDF verification'
          git push origin HEAD:main
      - name: Confirm no artifact
        run: |
          echo 'ZIP_OR_ARTIFACT_CREATED=NO'
          echo 'NOTEBOOK_UPLOADS=0'
          echo 'DERIVED_MARKDOWN_CREATED=0'
