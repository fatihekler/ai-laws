name: R013 targeted proposal and market verification

on:
  push:
    paths:
      - '.github/workflows/r013-temporary-source-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact source state
        uses: actions/checkout@v4

      - name: Probe Parliament resolution variants
        shell: bash
        run: |
          set -u
          probe() {
            id="$1"
            url="$2"
            body="$(mktemp)"
            hdr="$(mktemp)"
            status="$(curl -L --connect-timeout 20 --max-time 90 -sS -A 'Mozilla/5.0' -D "$hdr" -o "$body" -w '%{http_code}' "$url" || true)"
            ctype="$(grep -i '^content-type:' "$hdr" | tail -1 | tr -d '\r' | cut -d' ' -f2- || true)"
            bytes="$(wc -c < "$body" | tr -d ' ')"
            sha="$(sha256sum "$body" | awk '{print $1}')"
            echo "SOURCE_ID=${id}"
            echo "HTTP_STATUS=${status}"
            echo "CONTENT_TYPE=${ctype}"
            echo "BYTE_SIZE=${bytes}"
            echo "SHA256=${sha}"
            if [ "$bytes" -gt 0 ]; then
              if echo "$ctype" | grep -qi pdf; then
                pdftotext "$body" - 2>/dev/null | grep -inE -C 4 'insurance|high-risk|strict liability|compensation' | head -n 120 || true
              else
                tr '\n' ' ' < "$body" | sed -E 's/<[^>]+>/ /g; s/[[:space:]]+/ /g' | grep -Eio '.{0,260}(insurance|high-risk|strict liability|compensation).{0,520}' | head -n 20 || true
              fi
            fi
            echo '---'
            rm -f "$body" "$hdr"
          }
          probe EP_RESOLUTION_PDF 'https://www.europarl.europa.eu/doceo/document/TA-9-2020-0276_EN.pdf'
          probe EP_RESOLUTION_XML 'https://www.europarl.europa.eu/doceo/document/TA-9-2020-0276_EN.xml'
          probe EP_RESOLUTION_HTML 'https://www.europarl.europa.eu/doceo/document/TA-9-2020-0276_EN.html'

      - name: Probe current Armilla market detail
        shell: bash
        run: |
          set -u
          for path in '/' '/ai-insurance' '/become-an-armilla-broker-ai-insurance-warranty'; do
            url="https://www.armilla.ai${path}"
            body="$(mktemp)"
            hdr="$(mktemp)"
            status="$(curl -L --connect-timeout 20 --max-time 90 -sS -A 'Mozilla/5.0' -D "$hdr" -o "$body" -w '%{http_code}' "$url" || true)"
            ctype="$(grep -i '^content-type:' "$hdr" | tail -1 | tr -d '\r' | cut -d' ' -f2- || true)"
            bytes="$(wc -c < "$body" | tr -d ' ')"
            echo "URL=${url}"
            echo "HTTP_STATUS=${status}"
            echo "CONTENT_TYPE=${ctype}"
            echo "BYTE_SIZE=${bytes}"
            tr '\n' ' ' < "$body" | sed -E 's/<script[^>]*>.*<\/script>/ /Ig; s/<style[^>]*>.*<\/style>/ /Ig; s/<[^>]+>/ /g; s/[[:space:]]+/ /g' | grep -Eio '.{0,240}(AI insurance|insurance|warranty|coverage|underwrit|policy|liability).{0,520}' | head -n 30 || true
            echo '---'
            rm -f "$body" "$hdr"
          done

      - name: Confirm bounded execution
        shell: bash
        run: |
          echo 'WORKFLOW_ARTIFACTS_CREATED=0'
          echo 'NOTEBOOK_UPLOADS=0'
          echo 'AUTO_ADVANCE=NO'
