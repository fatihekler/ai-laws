name: AI-LAWS R030 NB02 EU repository PDF inspection

on:
  push:
    paths:
      - '.github/workflows/r030-nb02-eu-pdf-inspect.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils curl file
      - name: Inspect NB02 repository PDFs and official source layer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv, hashlib, html, re, subprocess
          from pathlib import Path

          ids=[f'EU-{i:03d}' for i in range(1,11)]
          d=Path('86_NOTEBOOKLM/downloads')
          with (d/'DOWNLOADS_REGISTRY.csv').open(newline='',encoding='utf-8') as f:
              reg={r['manifest_source_id']:r for r in csv.DictReader(f) if r['manifest_source_id'] in ids}
          with Path('86_NOTEBOOKLM/NOTEBOOKLM_SOURCE_ACQUISITION_MANIFEST.csv').open(newline='',encoding='utf-8') as f:
              man={r['source_id']:r for r in csv.DictReader(f) if r['source_id'] in ids}
          assert set(reg)==set(ids), ('registry missing',sorted(set(ids)-set(reg)))
          assert set(man)==set(ids), ('manifest missing',sorted(set(ids)-set(man)))

          markers={
            'EU-001':['2024/1689','artificial intelligence'],
            'EU-002':['2026/1744'],
            'EU-003':['2024/2853','defective products'],
            'EU-004':['charter of fundamental rights'],
            'EU-005':['2016/679','personal data'],
            'EU-006':['2022/2065','digital services'],
            'EU-007':['2023/2854','fair access to and use of data'],
            'EU-008':['2022/868','data governance'],
            'EU-009':['2022/2555','cybersecurity'],
            'EU-010':['2024/2847','cyber resilience'],
          }
          celex={
            'EU-001':'32024R1689','EU-002':'32026R1744','EU-003':'32024L2853',
            'EU-004':'12016P/TXT','EU-005':'32016R0679','EU-006':'32022R2065',
            'EU-007':'32023R2854','EU-008':'32022R0868','EU-009':'32022L2555','EU-010':'32024R2847'
          }
          def run(cmd): return subprocess.check_output(cmd,text=True,errors='replace')
          def clean(x,n=900): return ' '.join(str(x).replace('|','/').split())[:n]
          def get(url,name):
              out=Path('/tmp')/name
              cmd=['curl','-L','--silent','--show-error','--fail-with-body','--connect-timeout','15','--max-time','90','--retry','1','-A','Mozilla/5.0 AI-LAWS source verification','-o',str(out),'-w','%{http_code}|%{content_type}|%{url_effective}',url]
              try:
                  meta=run(cmd).strip(); b=out.read_bytes(); return meta,b,out
              except subprocess.CalledProcessError as e:
                  return f'FAILED:{e.returncode}',b'',out

          for sid in ids:
              r=reg[sid]; m=man[sid]; p=d/r['repo_filename']; assert p.exists(),(sid,p)
              b=p.read_bytes(); sha=hashlib.sha256(b).hexdigest(); blob=run(['git','hash-object',str(p)]).strip()
              info=run(['pdfinfo',str(p)]); txt=run(['pdftotext','-layout',str(p),'-'])
              norm=' '.join(txt.lower().split())
              pages=(re.search(r'^Pages:\s+(\d+)',info,re.M) or [None,'UNKNOWN'])[1]
              title=(re.search(r'^Title:\s*(.*)$',info,re.M) or [None,'UNKNOWN'])[1]
              mk=';'.join(f'{x}={"YES" if x.lower() in norm else "NO"}' for x in markers[sid])
              print(f'PDF|{sid}|filename={clean(r["repo_filename"],180)}|blob={blob}|sha256={sha}|bytes={len(b)}|pages={pages}|textchars={len(txt)}|title={clean(title,250)}|markers={mk}')
              print(f'HEAD|{sid}|{clean(txt[:6500],1000)}')
              print(f'TAIL|{sid}|{clean(txt[-5000:],800)}')
              url=m.get('official_url','').strip()
              meta,ob,op=get(url,sid+'-landing') if url else ('NO_URL',b'',Path('/tmp/x'))
              print(f'OFFICIAL|{sid}|url={url}|curl={meta}|bytes={len(ob)}|sha256={hashlib.sha256(ob).hexdigest() if ob else "NONE"}|exact_repo={"YES" if ob and ob==b else "NO"}')
              if ob and 'pdf' not in meta.lower():
                  raw=ob.decode('utf-8','replace')
                  visible=' '.join(html.unescape(re.sub(r'<[^>]+>',' ',raw)).split())
                  print(f'OFFICIAL_HTML|{sid}|doc_marker={"YES" if any(x.lower() in visible.lower() for x in markers[sid]) else "NO"}|head={clean(visible,900)}')
              pdfurl='https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:'+celex[sid]
              pm,pb,pp=get(pdfurl,sid+'-celex.pdf')
              mime=run(['file','-b','--mime-type',str(pp)]).strip() if pb else 'NONE'
              exact='YES' if pb and pb==b else 'NO'
              print(f'CELEX_PDF|{sid}|url={pdfurl}|curl={pm}|mime={mime}|bytes={len(pb)}|sha256={hashlib.sha256(pb).hexdigest() if pb else "NONE"}|exact_repo={exact}')
              if pb and mime=='application/pdf':
                  try:
                      oi=run(['pdfinfo',str(pp)]); ot=run(['pdftotext','-layout',str(pp),'-'])
                      opages=(re.search(r'^Pages:\s+(\d+)',oi,re.M) or [None,'UNKNOWN'])[1]
                      print(f'CELEX_PDF_TEXT|{sid}|pages={opages}|textchars={len(ot)}|markers={";".join(f"{x}={\"YES\" if x.lower() in \" \".join(ot.lower().split()) else \"NO\"}" for x in markers[sid])}')
                  except Exception as e:
                      print(f'CELEX_PDF_TEXT|{sid}|PARSE_ERROR={clean(e,300)}')
          PY
      - name: Confirm no artifact or mutation
        run: |
          echo 'ZIP_OR_ARTIFACT_CREATED=NO'
          echo 'REPOSITORY_MUTATION_BY_INSPECTION_JOB=NO'
