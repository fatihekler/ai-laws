name: AI-LAWS R029 NB08 incident PDF inspection

on:
  push:
    paths:
      - '.github/workflows/r029-nb08-incident-pdf-inspect.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install inspection tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils curl file

      - name: Inspect NB08 repository PDFs and source URLs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv, hashlib, html, re, subprocess
          from pathlib import Path
          
          wanted=['INC-001','INC-002','INC-003','INC-004']
          d=Path('86_NOTEBOOKLM/downloads')
          
          with (d/'DOWNLOADS_REGISTRY.csv').open(newline='',encoding='utf-8') as f:
              reg={r['manifest_source_id']:r for r in csv.DictReader(f) if r['manifest_source_id'] in wanted}
          with Path('86_NOTEBOOKLM/NOTEBOOKLM_SOURCE_ACQUISITION_MANIFEST.csv').open(newline='',encoding='utf-8') as f:
              man={r['source_id']:r for r in csv.DictReader(f) if r['source_id'] in wanted}
          assert set(reg)==set(wanted), ('registry missing',sorted(set(wanted)-set(reg)))
          assert set(man)==set(wanted), ('manifest missing',sorted(set(wanted)-set(man)))
          
          expected={
            'INC-001':['openai','hugging face'],
            'INC-002':['redwood','metr'],
            'INC-003':['threat intelligence','anthropic'],
            'INC-004':['pace the frontier'],
          }
          
          def run(cmd):
              return subprocess.check_output(cmd,text=True,errors='replace')
          def clean(s,n=900):
              return ' '.join(str(s).replace('|','/').split())[:n]
          def fetch(url,sid):
              out=Path('/tmp')/(sid+'.source')
              cmd=['curl','-L','--silent','--show-error','--fail-with-body','--connect-timeout','15','--max-time','75','--retry','1','-A','Mozilla/5.0 AI-LAWS source verification','-o',str(out),'-w','%{http_code}|%{content_type}|%{url_effective}',url]
              try:
                  meta=run(cmd).strip()
                  b=out.read_bytes() if out.exists() else b''
                  mime=run(['file','-b','--mime-type',str(out)]).strip() if out.exists() else 'UNKNOWN'
                  return meta,mime,b
              except subprocess.CalledProcessError as e:
                  return f'ACCESS_FAILED:{e.returncode}','UNKNOWN',b''
          
          for sid in wanted:
              r=reg[sid]; m=man[sid]
              p=d/r['repo_filename']
              assert p.exists(), (sid,'missing',p)
              b=p.read_bytes(); sha=hashlib.sha256(b).hexdigest(); blob=run(['git','hash-object',str(p)]).strip()
              info=run(['pdfinfo',str(p)])
              pages=re.search(r'^Pages:\s+(\d+)',info,re.M)
              title=re.search(r'^Title:\s*(.*)$',info,re.M)
              producer=re.search(r'^Producer:\s*(.*)$',info,re.M)
              creation=re.search(r'^CreationDate:\s*(.*)$',info,re.M)
              text=run(['pdftotext','-layout',str(p),'-'])
              norm=' '.join(text.lower().split())
              markers=';'.join(f"{x}={'YES' if x.lower() in norm else 'NO'}" for x in expected[sid])
              print('MANIFEST|%s|title=%s|document_id=%s|authority=%s|binding=%s|method=%s|official_url=%s|rights=%s|notes=%s' % (
                  sid,clean(m.get('title')),clean(m.get('document_id')),clean(m.get('authority_class')),clean(m.get('binding_state')),clean(m.get('acquisition_method')),m.get('official_url',''),clean(m.get('rights_state')),clean(m.get('notes'),500)))
              print('REGISTRY|%s|filename=%s|institution=%s|variant=%s|identity=%s|currentness=%s|ingest=%s|label=%s' % (
                  sid,clean(r['repo_filename'],220),clean(r.get('institution')),clean(r.get('binary_variant')),clean(r.get('content_identity_state')),clean(r.get('currentness_state')),clean(r.get('notebook_ingest_mode')),clean(r.get('recommended_notebook_label'),300)))
              print('PDF|%s|blob=%s|sha256=%s|bytes=%d|pages=%s|title=%s|producer=%s|creation=%s|textchars=%d|markers=%s' % (
                  sid,blob,sha,len(b),pages.group(1) if pages else 'UNKNOWN',clean(title.group(1) if title else 'UNKNOWN',300),clean(producer.group(1) if producer else 'UNKNOWN',240),clean(creation.group(1) if creation else 'UNKNOWN',220),len(text),markers))
              print('HEAD|%s|%s' % (sid,clean(text[:7500],1400)))
              print('TAIL|%s|%s' % (sid,clean(text[-6500:],1200)))
              url=m.get('official_url','').strip()
              if not url:
                  print('SOURCE|%s|NO_URL' % sid); continue
              meta,mime,ob=fetch(url,sid)
              exact='YES' if ob and ob==b else 'NO'
              osha=hashlib.sha256(ob).hexdigest() if ob else 'NONE'
              print('SOURCE|%s|url=%s|curl=%s|mime=%s|bytes=%d|sha256=%s|exact_repo_bytes=%s' % (sid,url,meta,mime,len(ob),osha,exact))
              if mime=='application/pdf' and ob:
                  op=Path('/tmp')/(sid+'.source')
                  try:
                      oi=run(['pdfinfo',str(op)]); ot=run(['pdftotext','-layout',str(op),'-'])
                      opages=re.search(r'^Pages:\s+(\d+)',oi,re.M)
                      print('SOURCE_PDF|%s|pages=%s|textchars=%d|head=%s' % (sid,opages.group(1) if opages else 'UNKNOWN',len(ot),clean(ot[:5000],900)))
                  except Exception as e:
                      print('SOURCE_PDF|%s|PARSE_ERROR=%s' % (sid,clean(e,400)))
              elif ob:
                  raw=ob.decode('utf-8','replace')
                  visible=re.sub(r'<script.*?</script>|<style.*?</style>',' ',raw,flags=re.I|re.S)
                  visible=html.unescape(re.sub(r'<[^>]+>',' ',visible))
                  pdf_links=re.findall(r'href=["\']([^"\']+\.pdf(?:\?[^"\']*)?)["\']',raw,flags=re.I)
                  print('SOURCE_HTML|%s|text=%s|pdf_links=%s' % (sid,clean(visible,1200),clean(';'.join(pdf_links[:10]),1200)))
          PY

      - name: Confirm no artifact
        run: |
          echo 'ZIP_OR_ARTIFACT_CREATED=NO'
          echo 'REPOSITORY_MUTATION_BY_INSPECTION_JOB=NO'
