dispute:
  subject: Director red-flags oversight claim and bad-faith threshold
  facts_summary: "Derivative plaintiffs alleged that McDonald's directors ignored red flags concerning sexual harassment and misconduct. The opinion evaluated both directors' knowledge and their subsequent response."
  parties_generalized: Stockholder derivative plaintiffs; corporate directors; nominal corporation
  procedural_posture: Motion to dismiss director claims for failure to state a claim
legal_basis:
  provisions:
    - instrument: Delaware fiduciary law / Caremark red-flags doctrine
      article: "Duty-of-loyalty / bad-faith oversight standard"
      role: Director oversight and conscious-disregard analysis
court_content:
  holding: "Although the pleaded facts supported an inference that directors knew of a problem, the complaint did not support an inference that they consciously failed to respond in bad faith. The director defendants' motion to dismiss was granted."
  reasoning_summary: "A red-flags theory requires more than a weak, inadequate or even grossly negligent response. The pleading must support an inference of a serious oversight failure amounting to bad faith. The record described board engagement, outside consultants, revised policies, training and other responses, which defeated the pleaded bad-faith inference on the facts before the court."
  result: DIRECTOR_CLAIMS_DISMISSED_AT_PLEADING_STAGE
  direct_quotes:
    - quote: "The Director Defendants’ motion to dismiss the claims against them is granted."
