name: R015 corporate governance source acquisition

on:
  push:
    paths:
      - '.github/workflows/r015-temporary-corporate-governance-acquire.yml'

permissions:
  contents: write

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact trigger state
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail closed on drift
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"

      - name: Install extraction tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils >/dev/null

      - name: Acquire verify and pin official sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p 30_CASE_LAW/US-DE/source_snapshots
          mkdir -p 75_CORPORATE_GOVERNANCE/source_acquisition
          out='75_CORPORATE_GOVERNANCE/source_acquisition/AI-LAWS-R015_SOURCE_ACQUISITION_RESULTS_2026-09-14.csv'
          printf '%s\n' 'source_key,jurisdiction,authority_class,title,official_url,http_status,content_type,byte_size,sha256,pages,verification_state,repository_snapshot,notes' > "$out"

          csvq() { python3 -c 'import csv,sys; csv.writer(sys.stdout,lineterminator="").writerow(sys.argv[1:])' "$@"; }

          # Existing controlled EU AI Act snapshot: inspect exact repository binary already verified by R030.
          ai='86_NOTEBOOKLM/downloads/Current consolidated AI Act.pdf'
          test -f "$ai"
          ai_sha="$(sha256sum "$ai" | awk '{print $1}')"
          ai_bytes="$(wc -c < "$ai" | tr -d ' ')"
          ai_pages="$(pdfinfo "$ai" | awk -F: '/^Pages:/{gsub(/ /,"",$2);print $2}')"
          test "$ai_sha" = '1ccd38d1c78482cf2053b70110115adcc5080700acc8bd7bead8cb3579143ccf'
          pdftotext -layout "$ai" /tmp/r015-ai-act.txt
          grep -q 'Article 17' /tmp/r015-ai-act.txt
          grep -q 'Quality management system' /tmp/r015-ai-act.txt
          grep -q 'Article 55' /tmp/r015-ai-act.txt
          grep -q 'Obligations of providers of general-purpose AI models with systemic risk' /tmp/r015-ai-act.txt
          csvq 'EU-001' 'EU' 'STATUTE_OR_REGULATION' 'Artificial Intelligence Act — current consolidated snapshot' 'https://eur-lex.europa.eu/eli/reg/2024/1689' 'REPOSITORY_CONTROLLED' 'application/pdf' "$ai_bytes" "$ai_sha" "$ai_pages" 'VERIFIED_EXISTING_R030_EXACT_OFFICIAL_PDF; R015_ART17_ART55_MARKERS_VERIFIED' 'EXISTING_REPOSITORY_BINARY' 'Entity/provider organizational obligations; do not infer board/officer personal liability.' >> "$out"; printf '\n' >> "$out"

          # Existing NIST AI RMF snapshot + live publication-page recheck. It remains voluntary/nonbinding.
          nist='86_NOTEBOOKLM/downloads/NIST AI RMF 1.0.pdf'
          test -f "$nist"
          nist_sha="$(sha256sum "$nist" | awk '{print $1}')"
          nist_bytes="$(wc -c < "$nist" | tr -d ' ')"
          nist_pages="$(pdfinfo "$nist" | awk -F: '/^Pages:/{gsub(/ /,"",$2);print $2}')"
          pdftotext -layout "$nist" /tmp/r015-nist.txt
          grep -qi 'GOVERN' /tmp/r015-nist.txt
          nist_url='https://www.nist.gov/publications/artificial-intelligence-risk-management-framework-ai-rmf-10'
          nh="$(mktemp)"; nb="$(mktemp)"
          ns="$(curl -L --connect-timeout 20 --max-time 90 -sS -A 'Mozilla/5.0' -D "$nh" -o "$nb" -w '%{http_code}' "$nist_url" || true)"
          test "$ns" = '200'
          grep -Eqi 'Artificial Intelligence Risk Management Framework|AI RMF' "$nb"
          nctype="$(grep -i '^content-type:' "$nh" | tail -1 | tr -d '\r' | cut -d' ' -f2- || true)"
          csvq 'US-007' 'US' 'OFFICIAL_STANDARD_OR_FRAMEWORK' 'NIST AI Risk Management Framework 1.0' "$nist_url" "$ns" "$nctype" "$nist_bytes" "$nist_sha" "$nist_pages" 'OFFICIAL_PAGE_RECHECKED; REPOSITORY_SNAPSHOT_MARKERS_VERIFIED; VOLUNTARY_NONBINDING' 'EXISTING_REPOSITORY_BINARY' 'Govern function is operational framework evidence, not corporate fiduciary law; revision-state warning preserved.' >> "$out"; printf '\n' >> "$out"
          rm -f "$nh" "$nb"

          # Delaware Code §§ 141-142: current official HTML and transient Title 8 PDF hash; URL remains canonical/current source.
          de_url='https://delcode.delaware.gov/title8/c001/sc04/index.html'
          dh="$(mktemp)"; db="$(mktemp)"
          ds="$(curl -L --connect-timeout 20 --max-time 90 -sS -A 'Mozilla/5.0' -D "$dh" -o "$db" -w '%{http_code}' "$de_url")"
          test "$ds" = '200'
          grep -q '§ 141' "$db"
          grep -q 'Board of directors' "$db"
          grep -q '§ 142' "$db"
          grep -q 'Officers' "$db"
          dctype="$(grep -i '^content-type:' "$dh" | tail -1 | tr -d '\r' | cut -d' ' -f2-)"
          dbytes="$(wc -c < "$db" | tr -d ' ')"; dsha="$(sha256sum "$db" | awk '{print $1}')"
          csvq 'US-DE-STAT-001' 'US-DE' 'STATUTE_OR_REGULATION' 'Delaware General Corporation Law — Title 8 §§ 141-142 current official HTML' "$de_url" "$ds" "$dctype" "$dbytes" "$dsha" '' 'CURRENT_OFFICIAL_HTML_SECTION_MARKERS_VERIFIED' 'URL_DIRECT_ONLY' '§141 board management/direction; §142 officer roles. Current URL preferred over pinning a dynamic code snapshot.' >> "$out"; printf '\n' >> "$out"
          rm -f "$dh" "$db"

          title8_url='https://delcode.delaware.gov/title8/title8.pdf'
          th="$(mktemp)"; tp="$(mktemp)"
          ts="$(curl -L --connect-timeout 20 --max-time 120 -sS -A 'Mozilla/5.0' -D "$th" -o "$tp" -w '%{http_code}' "$title8_url")"
          tctype="$(grep -i '^content-type:' "$th" | tail -1 | tr -d '\r' | cut -d' ' -f2-)"
          test "$ts" = '200'; echo "$tctype" | grep -qi 'pdf'
          tbytes="$(wc -c < "$tp" | tr -d ' ')"; tsha="$(sha256sum "$tp" | awk '{print $1}')"; tpages="$(pdfinfo "$tp" | awk -F: '/^Pages:/{gsub(/ /,"",$2);print $2}')"
          pdftotext -layout "$tp" /tmp/r015-title8.txt
          grep -q '§ 141' /tmp/r015-title8.txt
          grep -q '§ 142' /tmp/r015-title8.txt
          csvq 'US-DE-STAT-001-PDF-PROBE' 'US-DE' 'STATUTE_OR_REGULATION' 'Delaware Code Title 8 — transient official PDF currentness probe' "$title8_url" "$ts" "$tctype" "$tbytes" "$tsha" "$tpages" 'OFFICIAL_PDF_BODY_VERIFIED_TRANSIENTLY' 'NOT_VENDORED_DYNAMIC_CODE' 'Hash records fetched bytes only; current official HTML remains preferred for material current-law claims.' >> "$out"; printf '\n' >> "$out"
          rm -f "$th" "$tp"

          acquire_case() {
            key="$1"; title="$2"; url="$3"; dest="$4"; marker1="$5"; marker2="$6"
            hdr="$(mktemp)"; tmp="$(mktemp)"
            status="$(curl -L --connect-timeout 20 --max-time 120 -sS -A 'Mozilla/5.0' -D "$hdr" -o "$tmp" -w '%{http_code}' "$url")"
            ctype="$(grep -i '^content-type:' "$hdr" | tail -1 | tr -d '\r' | cut -d' ' -f2-)"
            test "$status" = '200'; echo "$ctype" | grep -qi 'pdf'
            bytes="$(wc -c < "$tmp" | tr -d ' ')"; sha="$(sha256sum "$tmp" | awk '{print $1}')"; pages="$(pdfinfo "$tmp" | awk -F: '/^Pages:/{gsub(/ /,"",$2);print $2}')"
            text="$(mktemp)"; pdftotext -layout "$tmp" "$text"
            grep -Fqi "$marker1" "$text"; grep -Fqi "$marker2" "$text"
            mv "$tmp" "$dest"
            csvq "$key" 'US-DE' 'COURT_PRECEDENT' "$title" "$url" "$status" "$ctype" "$bytes" "$sha" "$pages" 'OFFICIAL_COURT_FULL_TEXT_VERIFIED' "$dest" 'Pinned official judicial opinion for page/holding verification; analogical corporate-governance precedent, not direct AI precedent.' >> "$out"; printf '\n' >> "$out"
            rm -f "$hdr" "$text"
          }

          acquire_case 'US-DE-CASE-001' 'Marchand v. Barnhill' 'https://courts.delaware.gov/Opinions/Download.aspx?id=291200&lang=en' '30_CASE_LAW/US-DE/source_snapshots/US-DE-CASE-001__MARCHAND-v-BARNHILL__2019-06-19.pdf' 'Marchand' 'Barnhill'
          acquire_case 'US-DE-CASE-002' "In re McDonald's Corp. Stockholder Derivative Litigation — officer oversight opinion" 'https://courts.delaware.gov/Opinions/Download.aspx?id=343130' '30_CASE_LAW/US-DE/source_snapshots/US-DE-CASE-002__MCDONALDS__OFFICER-OVERSIGHT__2023-01-26.pdf' "McDonald's" '2021-0324-JTL'
          acquire_case 'US-DE-CASE-003' "In re McDonald's Corp. Stockholder Derivative Litigation — director dismissal opinion" 'https://courts.delaware.gov/Opinions/Download.aspx?id=344560' '30_CASE_LAW/US-DE/source_snapshots/US-DE-CASE-003__MCDONALDS__DIRECTOR-DISMISSAL__2023-03-01.pdf' "McDonald's" '2021-0324-JTL'

          # SEC current disclosure layer: current eCFR endpoint probes + fixed adopting release.
          for section in 229.105 229.303 229.407; do
            u="https://www.ecfr.gov/current/title-17/chapter-II/part-229/section-${section}"
            h="$(mktemp)"; b="$(mktemp)"
            s="$(curl -L --connect-timeout 20 --max-time 90 -sS -A 'Mozilla/5.0' -D "$h" -o "$b" -w '%{http_code}' "$u" || true)"
            ct="$(grep -i '^content-type:' "$h" | tail -1 | tr -d '\r' | cut -d' ' -f2- || true)"; by="$(wc -c < "$b" | tr -d ' ')"; sh="$(sha256sum "$b" | awk '{print $1}')"
            state='CURRENT_ECFR_HTTP_BODY_ACQUIRED'
            if [ "$s" != '200' ]; then state="ECFR_ACCESS_${s}"; fi
            csvq "US-SEC-${section}" 'US' 'STATUTE_OR_REGULATION' "17 CFR § ${section} — current eCFR probe" "$u" "$s" "$ct" "$by" "$sh" '' "$state" 'URL_DIRECT_ONLY' 'Current regulation source; dynamic currentness must be rechecked before material issuer-disclosure conclusions.' >> "$out"; printf '\n' >> "$out"
            rm -f "$h" "$b"
          done

          sec_url='https://www.sec.gov/files/rules/final/2009/33-9089.pdf'
          shdr="$(mktemp)"; spdf="$(mktemp)"
          ss="$(curl -L --connect-timeout 20 --max-time 120 -sS -A 'Mozilla/5.0 research-source-verification' -D "$shdr" -o "$spdf" -w '%{http_code}' "$sec_url" || true)"
          sct="$(grep -i '^content-type:' "$shdr" | tail -1 | tr -d '\r' | cut -d' ' -f2- || true)"; sby="$(wc -c < "$spdf" | tr -d ' ')"; ssh="$(sha256sum "$spdf" | awk '{print $1}')"
          spages=''; sstate="SEC_FINAL_RULE_ACCESS_${ss}"
          if [ "$ss" = '200' ] && echo "$sct" | grep -qi 'pdf'; then
            spages="$(pdfinfo "$spdf" | awk -F: '/^Pages:/{gsub(/ /,"",$2);print $2}')"
            pdftotext -layout "$spdf" /tmp/r015-sec-9089.txt
            grep -qi 'board.*risk oversight' /tmp/r015-sec-9089.txt
            sstate='OFFICIAL_SEC_FINAL_RULE_BODY_VERIFIED'
          fi
          csvq 'US-SEC-33-9089' 'US' 'STATUTE_OR_REGULATION' 'SEC Proxy Disclosure Enhancements — Release 33-9089' "$sec_url" "$ss" "$sct" "$sby" "$ssh" "$spages" "$sstate" 'URL_DIRECT_ONLY' 'Historical adopting release for Regulation S-K Item 407(h); current eCFR remains controlling current regulatory source.' >> "$out"; printf '\n' >> "$out"
          rm -f "$shdr" "$spdf"

          # SEC AI-washing statement: enforcement/disclosure signal only, not a new general AI-specific rule.
          aw_url='https://www.sec.gov/newsroom/speeches-statements/sec-chair-gary-gensler-ai-washing'
          ah="$(mktemp)"; ab="$(mktemp)"
          as="$(curl -L --connect-timeout 20 --max-time 90 -sS -A 'Mozilla/5.0 research-source-verification' -D "$ah" -o "$ab" -w '%{http_code}' "$aw_url" || true)"
          act="$(grep -i '^content-type:' "$ah" | tail -1 | tr -d '\r' | cut -d' ' -f2- || true)"; aby="$(wc -c < "$ab" | tr -d ' ')"; ash="$(sha256sum "$ab" | awk '{print $1}')"
          astate="SEC_STATEMENT_ACCESS_${as}"
          if [ "$as" = '200' ] && grep -qi 'AI Washing' "$ab"; then astate='OFFICIAL_SEC_STATEMENT_IDENTITY_VERIFIED_NONBINDING'; fi
          csvq 'US-SEC-AI-WASHING-2024' 'US' 'OFFICIAL_GUIDANCE' 'SEC Chair statement on AI washing' "$aw_url" "$as" "$act" "$aby" "$ash" '' "$astate" 'URL_DIRECT_ONLY' 'Staff/chair statement and enforcement signal; not regulation and not a standalone private-liability rule.' >> "$out"; printf '\n' >> "$out"
          rm -f "$ah" "$ab"

          echo 'ZIP_OR_ARTIFACT_CREATED=NO'
          echo 'NOTEBOOK_UPLOADS=0'
          echo 'AUTO_ADVANCE=NO'

      - name: Commit pinned source snapshots and acquisition record
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Fatih Mehmet Ekler'
          git config user.email '5189511+fatihekler@users.noreply.github.com'
          git add 30_CASE_LAW/US-DE/source_snapshots 75_CORPORATE_GOVERNANCE/source_acquisition/AI-LAWS-R015_SOURCE_ACQUISITION_RESULTS_2026-09-14.csv
          git diff --cached --check
          git commit -m 'sources(r015): pin governance case law and verification record'
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git push origin HEAD:main
          printf 'SOURCE_COMMIT=%s\nSOURCE_TREE=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})"
