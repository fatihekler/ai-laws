name: AI-LAWS R010 persist Korea-Japan baseline

on:
  push:
    paths:
      - '.github/workflows/r010-persist.yml'

permissions:
  contents: write

jobs:
  persist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fresh drift gate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          echo 'R010_DRIFT_GATE=PASS'
      - name: Generate controlled R010 durable state
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/r010_persist.py
      - name: Validate R010 durable state
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -f 20_JURISDICTIONS/KR/KR_AI_DATA_PRIMARY_SOURCE_MAP_2026-09-14.md
          test -f 20_JURISDICTIONS/KR/KR_PRIMARY_SOURCE_INVENTORY_2026-09-14.csv
          test -f 20_JURISDICTIONS/KR/KR_CURRENTNESS_AND_BINDING_STATE_MATRIX.csv
          test -f 20_JURISDICTIONS/JP/JP_AI_POLICY_DATA_PRIMARY_SOURCE_MAP_2026-09-14.md
          test -f 20_JURISDICTIONS/JP/JP_PRIMARY_SOURCE_INVENTORY_2026-09-14.csv
          test -f 20_JURISDICTIONS/JP/JP_CURRENTNESS_AND_BINDING_STATE_MATRIX.csv
          test -f 95_RESEARCH/ASIA/AI-LAWS-R010_CLOSEOUT_2026-09-14.md
          test "$(grep -c '^KR-00' 20_JURISDICTIONS/KR/KR_PRIMARY_SOURCE_INVENTORY_2026-09-14.csv)" -eq 3
          test "$(grep -c '^JP-00' 20_JURISDICTIONS/JP/JP_PRIMARY_SOURCE_INVENTORY_2026-09-14.csv)" -eq 5
          grep -q '^AI-LAWS-R010,P1,Asia comparative,.*COMPLETE_RESEARCH_BASELINE_L1_L2_CURRENTNESS_OPEN' 90_RESEARCH_QUEUE/INITIAL_RESEARCH_QUEUE.csv
          grep -q '^KR,Republic of Korea,NATIONAL,ASIA,AI_BASIC_ACT_DECREE_PIPA_L1_L2_CURRENT_BASELINE_COMPLETE_POLICY_PLAN_SOURCE_OPEN' 20_JURISDICTIONS/JURISDICTION_RESEARCH_REGISTRY.csv
          grep -q '^JP,Japan,NATIONAL,ASIA,AI_ACT_APPI_POLICY_GUIDANCE_L1_L2_CURRENT_BASELINE_COMPLETE' 20_JURISDICTIONS/JURISDICTION_RESEARCH_REGISTRY.csv
          grep -q '^NB05,KR-001,REQUIRED,' 86_NOTEBOOKLM/NOTEBOOKLM_SOURCE_PACK_ASSIGNMENTS.csv
          grep -q '^NB05,JP-005,RECOMMENDED,' 86_NOTEBOOKLM/NOTEBOOKLM_SOURCE_PACK_ASSIGNMENTS.csv
          grep -q '^NB-BATCH-NB05-20260914-003,KR-001,' 86_NOTEBOOKLM/NOTEBOOKLM_ACQUISITION_AND_VALIDATION_LEDGER.csv
          grep -q '^NB-BATCH-NB05-20260914-003,JP-005,' 86_NOTEBOOKLM/NOTEBOOKLM_ACQUISITION_AND_VALIDATION_LEDGER.csv
          grep -q 'KR_SEPARATE_CURRENT_AI_POLICY_PLAN_SOURCE = NOT_PINNED_R010' 95_RESEARCH/ASIA/AI-LAWS-R010_CLOSEOUT_2026-09-14.md
          grep -q 'JP005_AI_GUIDELINES_FOR_BUSINESS = VER_1_2_2026-03-31' 95_RESEARCH/ASIA/AI-LAWS-R010_CLOSEOUT_2026-09-14.md
          grep -q 'ZIP_OR_ARTIFACT_CREATED = NO' 95_RESEARCH/ASIA/AI-LAWS-R010_CLOSEOUT_2026-09-14.md
          if find 20_JURISDICTIONS/KR 20_JURISDICTIONS/JP 95_RESEARCH/ASIA -type f \( -name '*.zip' -o -name '*.tar' -o -name '*.gz' \) | grep -q .; then exit 1; fi
          echo 'R010_DURABLE_VALIDATION=PASS'
      - name: Commit and push R010 durable outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            20_JURISDICTIONS/KR \
            20_JURISDICTIONS/JP \
            95_RESEARCH/ASIA \
            20_JURISDICTIONS/JURISDICTION_RESEARCH_REGISTRY.csv \
            90_RESEARCH_QUEUE/INITIAL_RESEARCH_QUEUE.csv \
            00_CONTROL/CURRENT_CONTEXT_AND_NEXT_ACTION.md \
            86_NOTEBOOKLM/NOTEBOOKLM_SOURCE_ACQUISITION_MANIFEST.csv \
            86_NOTEBOOKLM/NOTEBOOKLM_SOURCE_PACK_ASSIGNMENTS.csv \
            86_NOTEBOOKLM/NOTEBOOKLM_ACQUISITION_AND_VALIDATION_LEDGER.csv \
            86_NOTEBOOKLM/NOTEBOOKLM_DOWNLOAD_AND_UPLOAD_LIST.md
          git diff --cached --check
          git status --short
          git commit -m 'research(r010): establish Korea Japan current-law policy baseline'
          git push origin HEAD:main
      - name: Confirm controlled stop
        shell: bash
        run: |
          echo 'ZIP_OR_ARTIFACT_CREATED=NO'
          echo 'NEW_BINARY_DOWNLOADS=0'
          echo 'NOTEBOOK_UPLOADS=0'
          echo 'AUTO_ADVANCE=NO'
          echo 'STOP=YES'
