name: AI-LAWS R027 validation normalization fix

on:
  push:
    paths:
      - '.github/workflows/r027-fix-validation-normalization.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize PDF marker whitespace matching
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/r027-nb01-durable-state.yml')
          t=p.read_text(encoding='utf-8')
          old="""            low=text.lower()\n            for marker in markers[sid]:\n                assert marker.lower() in low, (sid,'marker',marker)\n"""
          new="""            norm=' '.join(text.lower().split())\n            for marker in markers[sid]:\n                expected=' '.join(marker.lower().split())\n                assert expected in norm, (sid,'marker',marker)\n"""
          if old not in t:
              raise SystemExit('expected marker-validation block not found; fail closed')
          p.write_text(t.replace(old,new,1),encoding='utf-8')
          PY
          git diff -- .github/workflows/r027-nb01-durable-state.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/r027-nb01-durable-state.yml
          git commit -m 'validation(r027): normalize PDF marker whitespace'
          git push origin HEAD:main
