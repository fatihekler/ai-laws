dispute:
  subject: Director oversight / Caremark information-and-reporting systems after food-safety compliance failure
  facts_summary: "Derivative plaintiff challenged board oversight after Blue Bell's listeria outbreak. The complaint alleged no reasonable board-level system focused on food safety, a central issue for the single-product food company."
  parties_generalized: Stockholder derivative plaintiff; corporate directors/officers; nominal corporation
  procedural_posture: Appeal from dismissal; pleading-stage allegations evaluated in plaintiff's favor
legal_basis:
  provisions:
    - instrument: Delaware fiduciary law / Caremark line of authority
      article: "Caremark / Stone oversight doctrine; DGCL § 141 background"
      role: Director duty-of-loyalty / good-faith oversight framework
court_content:
  holding: "The complaint supported a reasonable inference that the board failed to make the required good-faith effort to establish a board-level monitoring/reporting system regarding a central compliance risk; dismissal was reversed and the matter remanded."
  reasoning_summary: "Directors retain substantial discretion to design context- and industry-specific oversight systems, but must make a good-faith effort to put a reasonable board-level monitoring/reporting system in place and monitor it. The court treated food safety as intrinsically central to Blue Bell's single-product business."
  result: REVERSED_AND_REMANDED_AT_PLEADING_STAGE
  direct_quotes:
    - quote: "make a good faith effort to implement an oversight system and then monitor it"
      source_locator: "official PDF pp. 31-32; text lines 769-793 in 2026-09-14 verification"
