            'INC-003':dict(sha='cdea01e84f61de63ad80eabaa949047290921eaa2bec738d401b06eef6adfb1c',blob='48c459ee3db4b5bfceb8ce80e05176fbf20bef27',size=10986135,pages=154,chars_min=250000,markers=['anthropic','threat intelligence']),
            'INC-004':dict(sha='d9413acf904198477bab3b6511a5549e3cece2c7c8c8873e4688207d187cd7fb',blob='ca827fbeac9e51d828d179f400717e79df71ab35',size=291556,pages=20,chars_min=45000,markers=['pace the frontier']),
          }
          
          with (d/'DOWNLOADS_REGISTRY.csv').open(newline='',encoding='utf-8') as f:
