name: AI-LAWS R011 persist human sovereignty baseline

on:
  push:
    paths:
      - '.github/workflows/r011-persist.yml'

permissions:
  contents: write

jobs:
  persist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fresh drift gate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          echo 'R011_DRIFT_GATE=PASS'
      - name: Generate R011 durable state
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
