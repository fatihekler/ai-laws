name: AI-LAWS R007 US current-source probe

on:
  push:
    paths:
      - '.github/workflows/r007-us-current-source-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Probe official federal and Utah sources
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request, re, ssl
          urls = {
            'UTAH_CH72_HTML':'https://le.utah.gov/xcode/Title13/Chapter72/13-72.html',
            'UTAH_SEC101_HTML':'https://le.utah.gov/xcode/Title13/Chapter72/13-72-S101.html',
            'WHITEHOUSE_EO14179':'https://www.whitehouse.gov/presidential-actions/2025/01/removing-barriers-to-american-leadership-in-artificial-intelligence/',
            'NIST_AIRMF':'https://www.nist.gov/publications/artificial-intelligence-risk-management-framework-ai-rmf-10',
          }
          ctx=ssl.create_default_context()
          for k,u in urls.items():
              req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0 AI-LAWS-R007'})
              try:
                  with urllib.request.urlopen(req,context=ctx,timeout=30) as r:
                      b=r.read()
                      txt=b.decode('utf-8','ignore')
                      print(f'=== {k} ===')
                      print('FINAL_URL=',r.geturl())
                      print('STATUS=',getattr(r,'status',None),'BYTES=',len(b),'TYPE=',r.headers.get('content-type'))
                      print('TITLE=',re.findall(r'<title[^>]*>(.*?)</title>',txt,re.I|re.S)[:1])
                      for marker in ['Artificial Intelligence Policy Act','Effective 5/6/2026','13-72-101','Chapter 72','Executive Order 14179','AI RMF 1.0']:
                          print(marker, marker.lower() in txt.lower())
              except Exception as e:
                  print(f'=== {k} ERROR === {type(e).__name__}: {e}')
          PY
          echo 'ZIP_OR_ARTIFACT_CREATED=NO'
