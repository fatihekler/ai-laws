name: AI-LAWS R028 NB03 official PDF resolver

on:
  push:
    paths:
      - '.github/workflows/r028-nb03-official-pdf-resolve.yml'

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Resolve Federal Register and NIST official PDFs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv, hashlib, json, re, subprocess, urllib.parse
          from pathlib import Path

          d=Path('86_NOTEBOOKLM/downloads')
          with (d/'DOWNLOADS_REGISTRY.csv').open(newline='',encoding='utf-8') as f:
              reg={r['manifest_source_id']:r for r in csv.DictReader(f)}

          def curl(url,out):
              cmd=['curl','-L','--silent','--show-error','--fail-with-body','--connect-timeout','15','--max-time','60','--retry','1','-A','Mozilla/5.0 AI-LAWS source verification','-o',str(out),'-w','%{http_code}|%{content_type}|%{url_effective}',url]
              try:
                  return subprocess.check_output(cmd,text=True,errors='replace').strip()
              except subprocess.CalledProcessError as e:
                  return f'FAILED:{e.returncode}'

          def compare(sid,url,label):
              p=d/reg[sid]['repo_filename']
              out=Path('/tmp')/(sid+'.resolved')
              meta=curl(url,out)
              if not out.exists():
                  print(f'RESOLVED|{sid}|{label}|url={url}|curl={meta}|download=NONE')
                  return
              ob=out.read_bytes(); rb=p.read_bytes()
              print(f'RESOLVED|{sid}|{label}|url={url}|curl={meta}|bytes={len(ob)}|sha256={hashlib.sha256(ob).hexdigest()}|repo_sha256={hashlib.sha256(rb).hexdigest()}|exact_repo_bytes={"YES" if ob==rb else "NO"}')

          # Federal Register API: resolve by executive order number.
          for sid,num in [('US-001','14179'),('US-005','14365')]:
              q=urllib.parse.urlencode({'conditions[executive_order_number]':num,'per_page':'20'})
              api='https://www.federalregister.gov/api/v1/documents.json?'+q
              out=Path('/tmp')/(sid+'.json')
              meta=curl(api,out)
              if not out.exists():
                  print(f'FRAPI|{sid}|EO={num}|curl={meta}|NO_RESPONSE'); continue
              try:
                  data=json.loads(out.read_text(encoding='utf-8'))
              except Exception as e:
                  print(f'FRAPI|{sid}|EO={num}|curl={meta}|JSON_ERROR={e}'); continue
              results=data.get('results',[])
              exact=[x for x in results if str(x.get('executive_order_number',''))==num]
              print(f'FRAPI|{sid}|EO={num}|curl={meta}|results={len(results)}|exact={len(exact)}')
              for x in exact[:3]:
                  print('FRDOC|%s|doc=%s|title=%s|publication=%s|signing=%s|html=%s|pdf=%s' % (sid,x.get('document_number'),str(x.get('title','')).replace('|','/'),x.get('publication_date'),x.get('signing_date'),x.get('html_url'),x.get('pdf_url')))
                  if x.get('pdf_url'):
                      compare(sid,x['pdf_url'],'FEDERAL_REGISTER_PDF')
                      break

          # NIST DOI resolvers and common official nvlpubs direct PDFs.
          nist={
            'US-007':['https://doi.org/10.6028/NIST.AI.100-1','https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.100-1.pdf'],
            'US-008':['https://doi.org/10.6028/NIST.AI.600-1','https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.600-1.pdf'],
          }
          for sid,urls in nist.items():
              for i,url in enumerate(urls,1):
                  compare(sid,url,f'NIST_OFFICIAL_CANDIDATE_{i}')
          PY
      - name: Confirm no artifact
        run: echo 'ZIP_OR_ARTIFACT_CREATED=NO'
