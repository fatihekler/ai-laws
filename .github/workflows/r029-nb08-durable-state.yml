          reg={r['manifest_source_id']:r for r in reg_rows if r['manifest_source_id'] in expected}
          assert set(reg)==set(expected)
          
          def run(cmd): return subprocess.check_output(cmd,text=True,errors='replace')
          def fetch(url,name):
