name: AI-LAWS R010 Korea bounded metadata probe
on:
  push:
    paths:
      - '.github/workflows/r010-current-law-detail-probe.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Resolve Korea law wrapper and current metadata
        shell: bash
        run: |
          set -u
          python3 - <<'PY'
          import urllib.parse
          names=[
            ('KR-001','인공지능 발전과 신뢰 기반 조성 등에 관한 기본법'),
            ('KR-002','인공지능 발전과 신뢰 기반 조성 등에 관한 기본법 시행령'),
            ('KR-003','개인정보 보호법'),
          ]
          with open('/tmp/targets.tsv','w',encoding='utf-8') as f:
              for sid,name in names:
                  u='https://www.law.go.kr/'+urllib.parse.quote('법령/'+name,safe='/')
                  f.write(sid+'\t'+u+'\n')
          PY
          while IFS=$'\t' read -r sid url; do
            echo "=== $sid ==="
            wrapper="$(curl -L --compressed --connect-timeout 10 --max-time 45 -A 'Mozilla/5.0 AI-LAWS-R010' -sS "$url" 2>&1)" || true
            echo "$wrapper" | head -c 6000
            echo
            iframe="$(printf '%s' "$wrapper" | grep -oE 'src="[^"]*lsInfoP.do[^\"]*"' | head -1 | sed 's/^src="//;s/"$//' | sed 's/&amp;/\&/g')"
            echo "IFRAME_PATH=$iframe"
            if [ -n "$iframe" ]; then
              case "$iframe" in http*) bodyurl="$iframe" ;; *) bodyurl="https://www.law.go.kr${iframe}" ;; esac
              echo "BODY_URL=$bodyurl"
              curl -L --compressed --connect-timeout 10 --max-time 75 -A 'Mozilla/5.0 AI-LAWS-R010' -sS "$bodyurl" 2>&1 \
                | tr '\n\r\t' '   ' \
                | sed 's/<[^>]*>/ /g' \
                | sed 's/&nbsp;/ /g;s/&amp;/\&/g' \
                | tr -s ' ' \
                | head -c 16000 || true
              echo
            fi
          done < /tmp/targets.tsv
          echo 'ZIP_OR_ARTIFACT_CREATED=NO'
          echo 'BINARY_DOWNLOADS=0'
          echo 'AUTO_ADVANCE=NO'
