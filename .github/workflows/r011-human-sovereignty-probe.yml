name: AI-LAWS R011 human sovereignty bounded source probe

on:
  push:
    paths:
      - '.github/workflows/r011-human-sovereignty-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Probe controlled R011 source set
        shell: bash
        run: |
          set -euo pipefail
          echo "BASE_HEAD=$(git rev-parse HEAD)"
          echo "ZIP_OR_ARTIFACT_CREATED=NO"
          echo "NEW_BINARY_DOWNLOADS=0"
          echo "NOTEBOOK_UPLOADS=0"

          command -v pdftotext >/dev/null

          AI_ACT="86_NOTEBOOKLM/downloads/Current consolidated AI Act.pdf"
          CHARTER="86_NOTEBOOKLM/downloads/Charter of Fundamental Rights.pdf"
          GDPR="86_NOTEBOOKLM/downloads/GDPR.pdf"
          CETS="86_NOTEBOOKLM/downloads/CETS No.225 treaty status page .pdf"
          UNESCO_AI="86_NOTEBOOKLM/downloads/Recommendation on the Ethics of Artificial Intelligence.pdf"

          for f in "$AI_ACT" "$CHARTER" "$GDPR" "$CETS" "$UNESCO_AI"; do
            if [ -f "$f" ]; then
              echo "FILE_FOUND=$f"
            else
              echo "FILE_MISSING=$f"
            fi
          done

          pdftotext -layout "$AI_ACT" /tmp/ai-act.txt
          pdftotext -layout "$CHARTER" /tmp/charter.txt
          pdftotext -layout "$GDPR" /tmp/gdpr.txt
          if [ -f "$CETS" ]; then pdftotext -layout "$CETS" /tmp/cets.txt; fi
          if [ -f "$UNESCO_AI" ]; then pdftotext -layout "$UNESCO_AI" /tmp/unesco-ai.txt; fi

          python3 - <<'PY'
          from pathlib import Path
          import re

          def read(p):
              return Path(p).read_text(encoding='utf-8', errors='ignore')
          def norm(s):
              return re.sub(r'[ \t]+',' ',s).replace('\x0c','\n')
          def article(text, n, next_n=None, limit=15000):
              text=norm(text)
              pat=rf'(?mi)^\s*Article\s+{re.escape(str(n))}\s*$'
              m=re.search(pat,text)
              if not m:
                  pat=rf'(?mi)^\s*Article\s+{re.escape(str(n))}\b.*$'
                  m=re.search(pat,text)
              if not m: return 'NOT_FOUND'
              if next_n is None:
                  nxt=re.search(r'(?mi)^\s*Article\s+\d+[A-Za-z]*\b.*$',text[m.end():])
              else:
                  nxt=re.search(rf'(?mi)^\s*Article\s+{re.escape(str(next_n))}\b.*$',text[m.end():])
              end=m.end()+(nxt.start() if nxt else min(limit,len(text)-m.end()))
              return text[m.start():min(end,m.start()+limit)].strip()
          def context(text, term, radius=1200):
              text=norm(text)
              low=text.lower(); pos=low.find(term.lower())
              if pos<0: return 'NOT_FOUND'
              return text[max(0,pos-radius):min(len(text),pos+len(term)+radius)].strip()

          ai=read('/tmp/ai-act.txt')
          charter=read('/tmp/charter.txt')
          gdpr=read('/tmp/gdpr.txt')

          print('\n=== EU-001 AI ACT CONTROLLED SNAPSHOT ===')
          print('TERM_EMOTION_RECOGNITION=', context(ai,'emotion recognition system',1500))
          print('TERM_BIOMETRIC_CATEGORISATION=', context(ai,'biometric categorisation system',1500))
          print('ARTICLE_5=\n', article(ai,'5','6',18000))
          print('ARTICLE_50=\n', article(ai,'50','51',14000))

          print('\n=== EU-004 CHARTER CONTROLLED SNAPSHOT ===')
          for n in [1,3,7,8,21,24,47,51]:
              print(f'ARTICLE_{n}=\n',article(charter,str(n),str(n+1),6000))

          print('\n=== EU-005 GDPR CONTROLLED SNAPSHOT ===')
          print('BIOMETRIC_DEFINITION=', context(gdpr,'biometric data means',1800))
          print('PROFILING_DEFINITION=', context(gdpr,'profiling means',1800))
          for n in [7,9,13,14,15,16,17,18,21,22]:
              print(f'ARTICLE_{n}=\n',article(gdpr,str(n),str(n+1),10000))

          if Path('/tmp/cets.txt').exists():
              cets=read('/tmp/cets.txt')
              print('\n=== INT-001 CETS225 TREATY-TEXT SNAPSHOT ===')
              for n in [4,7,8,9,10,14,15]:
                  print(f'ARTICLE_{n}=\n',article(cets,str(n),str(n+1),8000))

          if Path('/tmp/unesco-ai.txt').exists():
              u=read('/tmp/unesco-ai.txt')
              print('\n=== INT-003 UNESCO AI ETHICS SNAPSHOT SEARCH ===')
              for term in ['human dignity','autonomy','mental','emotional','vulnerable']:
                  print(term.upper().replace(' ','_'),'=',context(u,term,1200))

          selected='\n'.join([ai,charter,gdpr])
          print('\n=== SELECTED BINDING-TEXT TERM CHECK ===')
          print('EXACT_COGNITIVE_LIBERTY_TERM_COUNT=', selected.lower().count('cognitive liberty'))
          print('GLOBAL_NEGATIVE_FINDING=NOT_ATTEMPTED')
          PY

          python3 - <<'PY'
          import urllib.request, urllib.error, re, html
          urls={
            'EU001_ELI':'https://eur-lex.europa.eu/eli/reg/2024/1689',
            'EU004_CHARTER':'https://eur-lex.europa.eu/eli/treaty/char_2016/oj/eng',
            'EU005_GDPR':'https://eur-lex.europa.eu/eli/reg/2016/679/oj/eng',
            'CL001_BCN':'https://www.bcn.cl/leychile/navegar?idNorma=1166983',
            'CL002_PJUD':'https://juris.pjud.cl/busqueda/u?c5762',
            'INT003_UNESCO_AI':'https://unesdoc.unesco.org/ark:/48223/pf0000381137',
            'INT004_UNESCO_NEURO_CERT':'https://unesdoc.unesco.org/ark:/48223/pf0000397812_eng',
            'INT001_COE_TREATY':'https://www.coe.int/en/web/conventions/full-list?module=treaty-detail&treatynum=225',
          }
          UA={'User-Agent':'Mozilla/5.0 AI-LAWS-R011 GitHub Actions source verification'}
          def clean(raw):
              txt=html.unescape(re.sub(r'<[^>]+>',' ',raw))
              return re.sub(r'\s+',' ',txt).strip()
          def around(txt, term, r=1000):
              p=txt.lower().find(term.lower())
              if p<0: return 'NOT_FOUND'
              return txt[max(0,p-r):min(len(txt),p+len(term)+r)]
          for sid,u in urls.items():
              print('\n=== LIVE',sid,'===')
              req=urllib.request.Request(u,headers=UA)
              try:
                  with urllib.request.urlopen(req,timeout=35) as resp:
                      body=resp.read(1200000)
                      raw=body.decode('utf-8','ignore')
                      txt=clean(raw)
                      print('STATUS=',resp.status)
                      print('FINAL_URL=',resp.geturl())
                      print('CONTENT_TYPE=',resp.headers.get('Content-Type'))
                      print('BODY_BYTES_READ=',len(body))
                      if sid=='CL001_BCN':
                          for term in ['Ley 21.383','actividad cerebral','integridad física y psíquica','Vigente']:
                              print('BCN_'+term.upper().replace(' ','_')+'=',around(txt,term,1300))
                      elif sid=='INT001_COE_TREATY':
                          for term in ['Status as of','Treaty No. 225','Signatures','Ratifications']:
                              print('COE_'+term.upper().replace(' ','_')+'=',around(txt,term,800))
                      elif sid.startswith('INT004'):
                          for term in ['Recommendation on the Ethics of Neurotechnology','31 March 2026','11 November 2025']:
                              print('UNESCO_NEURO_'+term.upper().replace(' ','_')+'=',around(txt,term,1000))
                      elif sid.startswith('INT003'):
                          print('UNESCO_AI_TITLE=',around(txt,'Recommendation on the Ethics of Artificial Intelligence',1000))
                      else:
                          print('TEXT_HEAD=',txt[:2500])
              except urllib.error.HTTPError as e:
                  print('HTTP_ERROR=',e.code)
                  print('FINAL_URL=',e.geturl())
              except Exception as e:
                  print('ERROR=',type(e).__name__,str(e))
          print('\nAUTO_ADVANCE=NO')
          print('ZIP_OR_ARTIFACT_CREATED=NO')
          print('NEW_BINARY_DOWNLOADS=0')
          print('NOTEBOOK_UPLOADS=0')
          PY
