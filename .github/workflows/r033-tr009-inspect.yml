name: AI-LAWS R033 TR-009 official-source inspection

on:
  push:
    paths:
      - '.github/workflows/r033-tr009-inspect.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y curl file poppler-utils

      - name: Inspect official Türkiye AI strategy sources
        shell: bash
        run: |
          set -euo pipefail
          echo "HEAD|$(git rev-parse HEAD)"
          echo "TREE|$(git rev-parse HEAD^{tree})"

          python3 - <<'PY'
          import hashlib, re, subprocess, urllib.parse
          from pathlib import Path

          def fetch(url, stem, max_time=90):
              p=Path('/tmp')/stem
              cmd=['curl','-L','--silent','--show-error','--connect-timeout','20','--max-time',str(max_time),'--retry','1','--retry-delay','2','-A','Mozilla/5.0 AI-LAWS source verification','-o',str(p),'-w','%{http_code}|%{content_type}|%{url_effective}',url]
              cp=subprocess.run(cmd,text=True,capture_output=True)
              b=p.read_bytes() if p.exists() else b''
              mime='NONE'
              if b:
                  mime=subprocess.check_output(['file','-b','--mime-type',str(p)],text=True,errors='replace').strip()
              sha=hashlib.sha256(b).hexdigest() if b else 'NONE'
              print(f'FETCH|{stem}|url={url}|rc={cp.returncode}|curl={cp.stdout.strip()}|mime={mime}|bytes={len(b)}|sha256={sha}')
              return cp.stdout.strip(), b, p, mime

          official_pages=[
              ('cbddo_root','https://www.cbddo.gov.tr/'),
              ('cbddo_root2','https://cbddo.gov.tr/'),
              ('sanayi_root','https://www.sanayi.gov.tr/'),
              ('sanayi_search_1','https://www.sanayi.gov.tr/arama?q=ulusal%20yapay%20zeka%20stratejisi'),
              ('sanayi_search_2','https://www.sanayi.gov.tr/arama?q=yapay%20zeka'),
              ('cbddo_uyzs','https://www.cbddo.gov.tr/uyzs'),
              ('cbddo_ai','https://www.cbddo.gov.tr/projeler/uyzs'),
          ]

          discovered=[]
          for stem,url in official_pages:
              meta,b,p,mime=fetch(url,stem)
              if not b: continue
              text=b.decode('utf-8','replace')
              visible=' '.join(re.sub(r'<[^>]+>',' ',text).split())
              markers=['Ulusal Yapay Zeka Stratejisi','Ulusal Yapay Zekâ Stratejisi','2024-2025','2026','2021-2025','Eylem Planı','Eylem Plani']
              print('MARKERS|'+stem+'|'+'|'.join(m+'='+('YES' if m.lower() in visible.lower() else 'NO') for m in markers))
              for href in re.findall(r'''(?:href|src)=["']([^"']+)["']''',text,flags=re.I):
                  full=urllib.parse.urljoin(meta.split('|')[-1] if '|' in meta else url,href.replace('&amp;','&'))
                  low=full.lower()
                  if any(k in low for k in ['yapay','zeka','zekâ','strateji','eylem','uyzs']) or low.endswith('.pdf'):
                      if full not in discovered:
                          discovered.append(full)
                          print('DISCOVERED|'+full)

          # Try official sitemap locations and mine them for AI-related URLs.
          for host in ['https://www.sanayi.gov.tr','https://www.cbddo.gov.tr','https://cbddo.gov.tr']:
              for suffix in ['/sitemap.xml','/sitemap_index.xml','/robots.txt']:
                  stem='map-'+re.sub(r'[^a-z0-9]+','-',(host+suffix).lower()).strip('-')[:60]
                  meta,b,p,mime=fetch(host+suffix,stem,45)
                  if not b: continue
                  text=b.decode('utf-8','replace')
                  for u in re.findall(r'https?://[^<\s"\']+',text):
                      low=u.lower()
                      if any(k in low for k in ['yapay','zeka','zekâ','strateji','eylem','uyzs']):
                          if u not in discovered:
                              discovered.append(u)
                              print('SITEMAP_DISCOVERED|'+u)

          # Known historical exact-source candidates; verify only, do not vendor.
          candidates=[
              'https://cbddo.gov.tr/SharedFolderServer/Genel/File/TR-UlusalYZStratejisi2021-2025.pdf',
              'https://www.cbddo.gov.tr/SharedFolderServer/Genel/File/TR-UlusalYZStratejisi2021-2025.pdf',
              'https://cbddo.gov.tr/SharedFolderServer/Genel/File/2024-2025-Ulusal-Yapay-Zeka-Stratejisi-Eylem-Plani.pdf',
              'https://www.cbddo.gov.tr/SharedFolderServer/Genel/File/2024-2025-Ulusal-Yapay-Zeka-Stratejisi-Eylem-Plani.pdf',
          ]
          for u in discovered:
              if u not in candidates and len(candidates)<80:
                  candidates.append(u)

          for i,u in enumerate(candidates,1):
              meta,b,p,mime=fetch(u,f'candidate-{i}',60)
              if not b: continue
              if mime=='application/pdf':
                  try:
                      info=subprocess.check_output(['pdfinfo',str(p)],text=True,errors='replace')
                      txt=subprocess.check_output(['pdftotext','-layout',str(p),'-'],text=True,errors='replace')
                      pages=re.search(r'^Pages:\s+(\d+)',info,re.M)
                      flat=' '.join(txt.split())
                      print(f'PDF_ID|{i}|pages={pages.group(1) if pages else "UNKNOWN"}|textchars={len(txt)}|UYZS={"YES" if "Ulusal Yapay" in txt and ("Zeka" in txt or "Zekâ" in txt) else "NO"}|2021_2025={"YES" if "2021-2025" in txt or "2021 – 2025" in txt else "NO"}|2024_2025={"YES" if "2024-2025" in txt or "2024 – 2025" in txt else "NO"}|2026={"YES" if "2026" in txt else "NO"}|head={flat[:1000]}')
                  except Exception as e:
                      print(f'PDF_ID|{i}|ERROR={type(e).__name__}:{e}')

          print('ZIP_OR_ARTIFACT_CREATED=NO')
          print('REPOSITORY_MUTATION_BY_INSPECTION_JOB=NO')
          PY
