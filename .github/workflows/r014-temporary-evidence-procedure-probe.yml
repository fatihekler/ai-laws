name: R014 bounded reconciliation cleanup

on:
  push:
    paths:
      - '.github/workflows/r014-temporary-evidence-procedure-probe.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact trigger state
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail closed on drift
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"

      - name: Reconcile queue context and closeout
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          research_commit = '5f9b671dc550da3d2e8c0911762248c249c848c8'

          qpath = Path('90_RESEARCH_QUEUE/INITIAL_RESEARCH_QUEUE.csv')
          qlines = qpath.read_text(encoding='utf-8').splitlines()
          idx = [i for i, line in enumerate(qlines) if line.startswith('AI-LAWS-R014,')]
          if len(idx) != 1:
              raise SystemExit(f'R014 queue row count unexpected: {len(idx)}')
          qlines[idx[0]] = 'AI-LAWS-R014,P0,Evidence and procedure,"Logging, evidence preservation, burden of proof, disclosure/discovery and missing-record consequences",COMPLETE_RESEARCH_BASELINE_L1_L2_EVIDENCE_PROCEDURE_EU_US_FEDERAL_SCOPE_LIMITS_OPEN,NONE,60_EVIDENCE/AI-LAWS-R014_EVIDENCE_PROCEDURE_BASELINE_2026-09-14.md; 60_EVIDENCE/AI-LAWS-R014_EVIDENCE_PROCEDURE_CROSSWALK_2026-09-14.csv; 60_EVIDENCE/AI-LAWS-R014_SOURCE_AND_CURRENTNESS_MATRIX_2026-09-14.csv; 95_RESEARCH/EVIDENCE/AI-LAWS-R014_CLOSEOUT_2026-09-14.md,"bounded EU + U.S. federal evidence/procedure baseline complete; Member-State/state procedure, case law, privilege/admissibility and concrete sanctions remain open; no global AI evidence rule inferred"'
          qpath.write_text('\n'.join(qlines) + '\n', encoding='utf-8')

          cpath = Path('00_CONTROL/CURRENT_CONTEXT_AND_NEXT_ACTION.md')
          ctx = cpath.read_text(encoding='utf-8')

          old = ' / R013_FINANCIAL_RESPONSIBILITY_BASELINE_COMPLETE_LIMITS_OPEN / R021_COMPLETE'
          new = ' / R013_FINANCIAL_RESPONSIBILITY_BASELINE_COMPLETE_LIMITS_OPEN / R014_EVIDENCE_PROCEDURE_BASELINE_COMPLETE_SCOPE_LIMITS_OPEN / R021_COMPLETE'
          if old not in ctx:
              raise SystemExit('context state marker missing')
          ctx = ctx.replace(old, new, 1)

          old = 'AI-LAWS-R013 = COMPLETE_RESEARCH_BASELINE_L1_L2_FINANCIAL_RESPONSIBILITY_CURRENT_LAW_MARKET_PROPOSAL_LIMITS_OPEN\nAI-LAWS-R021 = COMPLETE_SUPPORT_INFRASTRUCTURE'
          new = 'AI-LAWS-R013 = COMPLETE_RESEARCH_BASELINE_L1_L2_FINANCIAL_RESPONSIBILITY_CURRENT_LAW_MARKET_PROPOSAL_LIMITS_OPEN\nAI-LAWS-R014 = COMPLETE_RESEARCH_BASELINE_L1_L2_EVIDENCE_PROCEDURE_EU_US_FEDERAL_SCOPE_LIMITS_OPEN\nAI-LAWS-R021 = COMPLETE_SUPPORT_INFRASTRUCTURE'
          if old not in ctx:
              raise SystemExit('completed-unit marker missing')
          ctx = ctx.replace(old, new, 1)

          section = ('### R014 evidence and procedure baseline\n\n'
                     '```text\n'
                     'AI-LAWS-R014 — EVIDENCE AND PROCEDURE\n'
                     'STATE = COMPLETE_RESEARCH_BASELINE_L1_L2_EVIDENCE_PROCEDURE_EU_US_FEDERAL_SCOPE_LIMITS_OPEN\n'
                     'NEXT_BOUNDED_UNIT = NONE_AUTO_SELECTED\n'
                     '```\n\n'
                     'R014 separates regulatory log creation/retention, litigation preservation, access/disclosure, discovery scope and production, proof burdens/presumptions, and missing-record consequences. The controlled AI Act verifies Article 12 logging plus provider/deployer log retention under Articles 19 and 26(6), with an at-least-six-month minimum subject to other applicable law; this was not converted into a litigation hold.\n\n'
                     'Directive (EU) 2024/2853 Articles 9-10 verify a qualified disclosure and rebuttable-presumption architecture, but its 2026-12-09 transposition deadline means Member-State procedural implementation remains open. GDPR accountability/access/processing-record duties were mapped without converting them into general civil discovery.\n\n'
                     'The current U.S. Courts FRCP page was verified live and resolves the Dec. 1, 2025 official pamphlet. Rules 16, 26, 34 and 37(e) provide the bounded federal civil ESI preservation/discovery/production/consequence baseline. Rule 37(e) distinguishes prejudice-curative measures from the intent-to-deprive finding required for adverse presumption, adverse jury instruction, dismissal or default. U.S. state procedure and case-law interpretation remain open.\n\n'
                     'Durable outputs are under `60_EVIDENCE/` plus `95_RESEARCH/EVIDENCE/AI-LAWS-R014_CLOSEOUT_2026-09-14.md`. No global AI evidence rule was inferred.\n\n')
          marker = '### Notebook/source-processing lane\n'
          if marker not in ctx:
              raise SystemExit('notebook lane marker missing')
          ctx = ctx.replace(marker, section + marker, 1)

          old = 'R013_LEGAL_CONCLUSION = NOT_ATTEMPTED\nNOTEBOOK_UPLOAD_COUNT = 0'
          new = ('R013_LEGAL_CONCLUSION = NOT_ATTEMPTED\n'
                 'R014_EU_CONTROLLED_SOURCES = 3\n'
                 'R014_AI_ACT_ART12_LOGGING = VERIFIED_CURRENT_CONTROLLED_TEXT\n'
                 'R014_AI_ACT_ART19_PROVIDER_LOG_RETENTION = VERIFIED_CURRENT_CONTROLLED_TEXT\n'
                 'R014_AI_ACT_ART26_6_DEPLOYER_LOG_RETENTION = VERIFIED_CURRENT_CONTROLLED_TEXT\n'
                 'R014_AI_ACT_MINIMUM_LOG_RETENTION = AT_LEAST_6_MONTHS_SUBJECT_TO_OTHER_LAW\n'
                 'R014_PLD_ART9_DISCLOSURE = VERIFIED_PRIMARY_TEXT\n'
                 'R014_PLD_ART10_BURDEN_PRESUMPTIONS = VERIFIED_PRIMARY_TEXT\n'
                 'R014_PLD_TRANSPOSITION_DEADLINE = 2026-12-09\n'
                 'R014_PLD_MEMBER_STATE_PROCEDURE_MAP = NOT_ATTEMPTED\n'
                 'R014_GDPR_ACCOUNTABILITY_ACCESS_RECORDS = VERIFIED_PRIMARY_TEXT\n'
                 'R014_USCOURTS_CURRENT_FRCP_PAGE = VERIFIED_HTTP_200\n'
                 'R014_FRCP_CURRENT_PAMPHLET_DATE = 2025-12-01\n'
                 'R014_FRCP_PDF_SHA256 = bd8705fc038d87e4fe222a7ea2e4324222c9430e2373fce56826bd2dfa2f8baf\n'
                 'R014_FRCP_RULE26_DISCOVERY_PROPORTIONALITY_ESI_PLANNING = VERIFIED\n'
                 'R014_FRCP_RULE34_ESI_PRODUCTION = VERIFIED\n'
                 'R014_FRCP_RULE37E_ESI_PRESERVATION_CONSEQUENCES = VERIFIED\n'
                 'R014_US_STATE_PROCEDURE = NOT_ATTEMPTED\n'
                 'R014_CASE_LAW = NOT_ATTEMPTED\n'
                 'R014_NOTEBOOK_UPLOADS = 0\n'
                 'R014_DERIVED_MARKDOWN_CREATED = 0\n'
                 'R014_GLOBAL_AI_EVIDENCE_RULE = NOT_INFERRED\n'
                 'R014_LEGAL_CONCLUSION = NOT_ATTEMPTED\n'
                 'NOTEBOOK_UPLOAD_COUNT = 0')
          if old not in ctx:
              raise SystemExit('integrity marker missing')
          ctx = ctx.replace(old, new, 1)
          cpath.write_text(ctx, encoding='utf-8')

          close_path = Path('95_RESEARCH/EVIDENCE/AI-LAWS-R014_CLOSEOUT_2026-09-14.md')
          close = close_path.read_text(encoding='utf-8')
          placeholder = '`PENDING_R014_RESEARCH_COMMIT`'
          if placeholder not in close:
              raise SystemExit('closeout placeholder missing')
          close_path.write_text(close.replace(placeholder, f'`{research_commit}`', 1), encoding='utf-8')
          PY
          git diff --check

      - name: Commit reconciliation cleanup and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Fatih Mehmet Ekler'
          git config user.email '5189511+fatihekler@users.noreply.github.com'
          git rm .github/workflows/r014-temporary-evidence-procedure-probe.yml
          git add 00_CONTROL/CURRENT_CONTEXT_AND_NEXT_ACTION.md 90_RESEARCH_QUEUE/INITIAL_RESEARCH_QUEUE.csv 95_RESEARCH/EVIDENCE/AI-LAWS-R014_CLOSEOUT_2026-09-14.md
          git diff --cached --check
          git commit -m 'control(r014): reconcile state and cleanup helper'
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git push origin HEAD:main
          printf 'FINAL_HEAD=%s\nFINAL_TREE=%s\nHELPER_PRESENT=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" "$(test -e .github/workflows/r014-temporary-evidence-procedure-probe.yml && echo YES || echo NO)"
