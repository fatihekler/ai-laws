name: AI-LAWS R032 exact A-RES-79-1 PDF verification

on:
  push:
    paths:
      - '.github/workflows/r032-nb01-residual-inspect-v3.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils curl file
      - name: Verify exact official PDF
        shell: bash
        run: |
          set -euo pipefail
          URL='https://documents.un.org/api/symbol/access?s=A/RES/79/1&l=en&t=pdf'
          OUT='/tmp/A_RES_79_1.pdf'
          META=$(curl -L --silent --show-error --fail-with-body --connect-timeout 20 --max-time 120 --retry 2 --retry-delay 2 -A 'Mozilla/5.0 AI-LAWS source verification' -o "$OUT" -w '%{http_code}|%{content_type}|%{url_effective}' "$URL")
          echo "OFFICIAL|$META"
          echo "MIME|$(file -b --mime-type "$OUT")"
          echo "BYTES|$(wc -c < "$OUT")"
          echo "SHA256|$(sha256sum "$OUT" | awk '{print $1}')"
          pdfinfo "$OUT" | sed -n '1,30p'
          pdftotext -layout "$OUT" /tmp/a791.txt
          echo "TEXT_CHARS|$(wc -m < /tmp/a791.txt)"
          echo "SYMBOL_MATCH|$(grep -Fq 'A/RES/79/1' /tmp/a791.txt && echo YES || echo NO)"
          echo "PACT_MATCH|$(grep -Fq 'Pact for the Future' /tmp/a791.txt && echo YES || echo NO)"
          echo "GDC_MATCH|$(grep -Fq 'Global Digital Compact' /tmp/a791.txt && echo YES || echo NO)"
          echo 'TEXT_HEAD_BEGIN'
          sed -n '1,45p' /tmp/a791.txt
          echo 'TEXT_HEAD_END'
          echo 'TEXT_TAIL_BEGIN'
          tail -45 /tmp/a791.txt
          echo 'TEXT_TAIL_END'
          echo 'ZIP_OR_ARTIFACT_CREATED=NO'
          echo 'REPOSITORY_MUTATION_BY_INSPECTION_JOB=NO'
