name: R014 targeted current FRCP verification

on:
  push:
    paths:
      - '.github/workflows/r014-temporary-evidence-procedure-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact source state
        uses: actions/checkout@v4

      - name: Verify official current FRCP page and exact PDF
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils >/dev/null
          page='https://www.uscourts.gov/forms-rules/current-rules-practice-procedure/federal-rules-civil-procedure'
          html="$(mktemp)"
          curl -L --connect-timeout 20 --max-time 90 -sS -A 'Mozilla/5.0' -o "$html" "$page"
          echo '===== CURRENT PAGE SIGNAL ====='
          tr '\n' ' ' < "$html" | sed -E 's/<[^>]+>/ /g; s/[[:space:]]+/ /g' | grep -Eio '.{0,220}(Civil Rules were last amended in 2025|Federal Rules of Civil Procedure Pamphlet, Dec\. 1, 2025|Federal Rules of Civil Procedure).{0,420}' | head -n 20 || true
          href="$(grep -Eio 'href="[^"]*/federal-rules-of-civil-procedure\.pdf([?#][^"]*)?"' "$html" | sed -E 's/^href="//; s/"$//' | head -n 1)"
          test -n "$href"
          case "$href" in
            http*) pdfurl="$href" ;;
            /*) pdfurl="https://www.uscourts.gov${href}" ;;
            *) pdfurl="https://www.uscourts.gov/${href}" ;;
          esac
          echo "FRCP_PDF_URL=${pdfurl}"
          pdf="$(mktemp)"; hdr="$(mktemp)"
          status="$(curl -L --connect-timeout 20 --max-time 120 -sS -A 'Mozilla/5.0' -D "$hdr" -o "$pdf" -w '%{http_code}' "$pdfurl")"
          ctype="$(grep -i '^content-type:' "$hdr" | tail -1 | tr -d '\r' | cut -d' ' -f2-)"
          bytes="$(wc -c < "$pdf" | tr -d ' ')"
          sha="$(sha256sum "$pdf" | awk '{print $1}')"
          echo "FRCP_HTTP_STATUS=${status}"
          echo "FRCP_CONTENT_TYPE=${ctype}"
          echo "FRCP_BYTE_SIZE=${bytes}"
          echo "FRCP_SHA256=${sha}"
          test "$status" = '200'
          echo "$ctype" | grep -qi 'pdf'
          pdftotext -layout "$pdf" /tmp/frcp.txt
          echo '===== FRCP TITLE / AMENDMENT SIGNAL ====='
          head -n 100 /tmp/frcp.txt
          echo '===== FRCP RULE 26 ====='
          grep -inE -C 12 'Rule 26\.|Duty to Disclose|proportional to the needs|electronically stored information' /tmp/frcp.txt | head -n 360 || true
          echo '===== FRCP RULE 34 ====='
          grep -inE -C 12 'Rule 34\.|Producing Documents|electronically stored information|form or forms in which it is ordinarily maintained' /tmp/frcp.txt | head -n 360 || true
          echo '===== FRCP RULE 37(e) ====='
          grep -inE -C 16 'Rule 37\.|Failure to Preserve Electronically Stored Information|lost because a party failed to take reasonable steps|intent to deprive|presume that the lost information was unfavorable' /tmp/frcp.txt | head -n 440 || true
          rm -f "$html" "$pdf" "$hdr"

      - name: Confirm bounded execution
        shell: bash
        run: |
          echo 'WORKFLOW_ARTIFACTS_CREATED=0'
          echo 'NOTEBOOK_UPLOADS=0'
          echo 'NEW_REPOSITORY_BINARIES=0'
          echo 'AUTO_ADVANCE=NO'
