name: AI-LAWS R033 TR-009 fast official-source discovery

on:
  push:
    paths:
      - '.github/workflows/r033-tr009-discovery-fast.yml'

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Discover current official references
        shell: bash
        run: |
          set -euo pipefail
          echo "HEAD|$(git rev-parse HEAD)"
          python3 - <<'PY'
          import html, re, subprocess, urllib.parse
          from pathlib import Path

          def get(url, stem, timeout=30):
              p=Path('/tmp')/stem
              cp=subprocess.run(['curl','-L','--silent','--show-error','--connect-timeout','12','--max-time',str(timeout),'-A','Mozilla/5.0','-o',str(p),'-w','%{http_code}|%{content_type}|%{url_effective}',url],text=True,capture_output=True)
              b=p.read_bytes() if p.exists() else b''
              print(f'GET|{stem}|{cp.stdout.strip()}|bytes={len(b)}|rc={cp.returncode}')
              return cp.stdout.strip(), b

          queries=[
              'site:cbddo.gov.tr "Ulusal Yapay Zeka Stratejisi"',
              'site:cbddo.gov.tr "Ulusal Yapay Zekâ Stratejisi"',
              'site:sanayi.gov.tr "Ulusal Yapay Zeka Stratejisi"',
              'site:sanayi.gov.tr "Ulusal Yapay Zekâ Stratejisi"',
              'site:sanayi.gov.tr "2024-2025" "Yapay Zeka"',
              'site:gov.tr "2026" "Ulusal Yapay Zeka Stratejisi"',
              'site:gov.tr "2026-2030" "Yapay Zeka Stratejisi"',
          ]
          urls=[]
          for qi,q in enumerate(queries,1):
              search='https://www.google.com/search?q='+urllib.parse.quote(q)
              meta,b=get(search,f'g-{qi}',25)
              text=b.decode('utf-8','replace')
              # Google result links often appear in /url?q=...
              for raw in re.findall(r'href="([^"]+)"',text):
                  raw=html.unescape(raw)
                  if raw.startswith('/url?'):
                      qs=urllib.parse.parse_qs(urllib.parse.urlsplit(raw).query)
                      cand=(qs.get('q') or qs.get('url') or [''])[0]
                  else:
                      cand=raw
                  if cand.startswith('http') and any(h in cand for h in ['cbddo.gov.tr','sanayi.gov.tr','.gov.tr']):
                      if cand not in urls:
                          urls.append(cand); print('DISCOVERY|'+cand)

          # Directly verify every discovered official URL, but do not download/store it in repo.
          for i,u in enumerate(urls[:40],1):
              meta,b=get(u,f'o-{i}',35)
              text=b.decode('utf-8','replace')
              vis=' '.join(re.sub(r'<[^>]+>',' ',text).split())
              print(f'OFFICIAL_MARKERS|{i}|UYZS={"YES" if "Ulusal Yapay" in vis and ("Zeka" in vis or "Zekâ" in vis) else "NO"}|2021_2025={"YES" if "2021-2025" in vis or "2021 – 2025" in vis else "NO"}|2024_2025={"YES" if "2024-2025" in vis or "2024 – 2025" in vis else "NO"}|2026_2030={"YES" if "2026-2030" in vis or "2026 – 2030" in vis else "NO"}|url={u}|head={vis[:500]}')

          print('ZIP_OR_ARTIFACT_CREATED=NO')
          print('REPOSITORY_MUTATION_BY_DISCOVERY_JOB=NO')
          PY
