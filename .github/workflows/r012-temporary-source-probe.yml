name: R012 bounded reconciliation cleanup

on:
  push:
    paths:
      - '.github/workflows/r012-temporary-source-probe.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact trigger state
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail closed on drift
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"

      - name: Reconcile queue context and closeout
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          research_commit = '97a8a36495edef482df142167c2fac63f5b19dad'

          qpath = Path('90_RESEARCH_QUEUE/INITIAL_RESEARCH_QUEUE.csv')
          qlines = qpath.read_text(encoding='utf-8').splitlines()
          idx = [i for i, line in enumerate(qlines) if line.startswith('AI-LAWS-R012,')]
          if len(idx) != 1:
              raise SystemExit(f'R012 queue row count unexpected: {len(idx)}')
          qlines[idx[0]] = 'AI-LAWS-R012,P0,Liability,"Comparative actor/duty/breach/causation/damage/remedy model for model developer, provider, deployer, agent operator and tool provider",COMPLETE_RESEARCH_BASELINE_L1_L2_LIABILITY_MODEL_JURISDICTION_DEPENDENCIES_OPEN,jurisdiction profiles,40_LIABILITY/AI-LAWS-R012_COMPARATIVE_LIABILITY_BASELINE_2026-09-14.md; 40_LIABILITY/AI-LAWS-R012_ACTOR_LIABILITY_CHAIN_MATRIX_2026-09-14.csv; 40_LIABILITY/AI-LAWS-R012_SOURCE_AND_CURRENTNESS_MATRIX_2026-09-14.csv; 95_RESEARCH/LIABILITY/AI-LAWS-R012_CLOSEOUT_2026-09-14.md,"bounded EU/US comparative liability baseline complete; EU Member-State PLD transposition and national procedures; US state/private-law duties and case law; concrete breach causation damage remedy; other jurisdictions remain open; no global liability rule inferred"'
          qpath.write_text('\n'.join(qlines) + '\n', encoding='utf-8')

          cpath = Path('00_CONTROL/CURRENT_CONTEXT_AND_NEXT_ACTION.md')
          ctx = cpath.read_text(encoding='utf-8')
          old = ' / R011_HUMAN_SOVEREIGNTY_L1_L2_COMPLETE_SCOPE_LIMITS_OPEN / R021_COMPLETE'
          new = ' / R011_HUMAN_SOVEREIGNTY_L1_L2_COMPLETE_SCOPE_LIMITS_OPEN / R012_COMPARATIVE_LIABILITY_BASELINE_COMPLETE_DEPENDENCIES_OPEN / R021_COMPLETE'
          if old not in ctx:
              raise SystemExit('context state marker missing')
          ctx = ctx.replace(old, new, 1)

          old = 'AI-LAWS-R011 = COMPLETE_RESEARCH_BASELINE_L1_L2_RIGHTS_MAP_SCOPE_LIMITS_OPEN\nAI-LAWS-R021 = COMPLETE_SUPPORT_INFRASTRUCTURE'
          new = 'AI-LAWS-R011 = COMPLETE_RESEARCH_BASELINE_L1_L2_RIGHTS_MAP_SCOPE_LIMITS_OPEN\nAI-LAWS-R012 = COMPLETE_RESEARCH_BASELINE_L1_L2_LIABILITY_MODEL_JURISDICTION_DEPENDENCIES_OPEN\nAI-LAWS-R021 = COMPLETE_SUPPORT_INFRASTRUCTURE'
          if old not in ctx:
              raise SystemExit('completed-unit marker missing')
          ctx = ctx.replace(old, new, 1)

          section = ('### R012 — Comparative liability baseline\n\n'
                     'R012 established a bounded actor/duty/breach-or-defect/causation/damage/remedy/defence/evidence comparison from controlled EU liability sources and the current controlled U.S. source set.\n\n'
                     '```text\n'
                     'R012_CONTROLLED_SOURCE_RECORDS = 8\n'
                     'R012_EU_PRIMARY_LIABILITY_SOURCES = 3\n'
                     'R012_EU_PLD_SOFTWARE_AS_PRODUCT = VERIFIED\n'
                     'R012_EU_PLD_TRANSPOSITION_DEADLINE = 2026-12-09\n'
                     'R012_EU_PLD_MEMBER_STATE_TRANSPOSITION_MAP = NOT_ATTEMPTED\n'
                     'R012_GDPR_ARTICLE_82_COMPENSATION_ROUTE = VERIFIED_PRIMARY_TEXT\n'
                     'R012_AI_ACT_ROLE_TO_CIVIL_DEFENDANT_MAPPING = FACT_SPECIFIC_NOT_INFERRED\n'
                     'R012_US_GENERAL_AI_TORT_RULE = NOT_ESTABLISHED_BY_CONTROLLED_SOURCE_SET\n'
                     'R012_EURLEX_LIVE_RECHECK = HTTP_202_EMPTY_BODY\n'
                     'R012_NOTEBOOK_UPLOADS = 0\n'
                     'R012_GLOBAL_LIABILITY_RULE = NOT_INFERRED\n'
                     'R012_LEGAL_CONCLUSION = NOT_ATTEMPTED\n'
                     '```\n\n'
                     'The Product Liability Directive source includes software in its product definition and contains software/update/control, defectiveness, economic-operator, disclosure, burden/presumption, causation, damage, defence and allocation rules. Its Member-State transposition deadline is 2026-12-09, so current national implementation was not inferred. GDPR Article 82 was separately verified as a controller/processor compensation route. The AI Act remains a regulatory-duty layer and is not converted into a private civil-liability rule.\n\n'
                     'For the United States, the controlled federal source set remains executive/OMB/NIST-centric and does not establish a generally applicable private AI tort rule. This is a bounded source-gap result, not a negative finding that U.S. tort/product/privacy/consumer law cannot apply.\n\n'
                     'Durable outputs are under `40_LIABILITY/` plus `95_RESEARCH/LIABILITY/AI-LAWS-R012_CLOSEOUT_2026-09-14.md`.\n\n')
          marker = '### R021\n'
          if marker not in ctx:
              raise SystemExit('R021 insertion marker missing')
          ctx = ctx.replace(marker, section + marker, 1)

          next_section = ('### R012 comparative liability baseline\n\n'
                          '```text\n'
                          'AI-LAWS-R012 — COMPARATIVE LIABILITY\n'
                          'STATE = COMPLETE_RESEARCH_BASELINE_L1_L2_LIABILITY_MODEL_JURISDICTION_DEPENDENCIES_OPEN\n'
                          'NEXT_BOUNDED_UNIT = NONE_AUTO_SELECTED\n'
                          '```\n\n'
                          'R012 is complete only at its bounded comparative baseline. EU Member-State PLD transposition, U.S. private/state liability law and case law, other jurisdictions, and concrete actor/causation/damage/remedy determinations remain open. The queue remains authoritative; no successor unit is auto-selected.\n\n')
          marker = '### Notebook/source-processing lane\n'
          if marker not in ctx:
              raise SystemExit('notebook lane marker missing')
          ctx = ctx.replace(marker, next_section + marker, 1)

          old = 'R011_LIABILITY_CONCLUSION = NOT_ATTEMPTED\nNOTEBOOK_UPLOAD_COUNT = 0'
          new = ('R011_LIABILITY_CONCLUSION = NOT_ATTEMPTED\n'
                 'R012_CONTROLLED_SOURCE_RECORDS = 8\n'
                 'R012_EU_PRIMARY_LIABILITY_SOURCES = 3\n'
                 'R012_EU_PLD_SOFTWARE_AS_PRODUCT = VERIFIED\n'
                 'R012_EU_PLD_TRANSPOSITION_DEADLINE = 2026-12-09\n'
                 'R012_EU_PLD_MEMBER_STATE_TRANSPOSITION_MAP = NOT_ATTEMPTED\n'
                 'R012_GDPR_ARTICLE_82_COMPENSATION_ROUTE = VERIFIED_PRIMARY_TEXT\n'
                 'R012_US_GENERAL_AI_TORT_RULE = NOT_ESTABLISHED_BY_CONTROLLED_SOURCE_SET\n'
                 'R012_EURLEX_LIVE_RECHECK = HTTP_202_EMPTY_BODY\n'
                 'R012_NOTEBOOK_UPLOADS = 0\n'
                 'R012_DERIVED_MARKDOWN_CREATED = 0\n'
                 'R012_GLOBAL_LIABILITY_RULE = NOT_INFERRED\n'
                 'NOTEBOOK_UPLOAD_COUNT = 0')
          if old not in ctx:
              raise SystemExit('integrity marker missing')
          ctx = ctx.replace(old, new, 1)
          cpath.write_text(ctx, encoding='utf-8')

          close_path = Path('95_RESEARCH/LIABILITY/AI-LAWS-R012_CLOSEOUT_2026-09-14.md')
          close = close_path.read_text(encoding='utf-8')
          placeholder = '`PENDING_R012_RESEARCH_COMMIT`'
          if placeholder not in close:
              raise SystemExit('closeout placeholder missing')
          close_path.write_text(close.replace(placeholder, f'`{research_commit}`', 1), encoding='utf-8')
          PY
          git diff --check

      - name: Commit reconciliation cleanup and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Fatih Mehmet Ekler'
          git config user.email '5189511+fatihekler@users.noreply.github.com'
          git rm .github/workflows/r012-temporary-source-probe.yml
          git add 00_CONTROL/CURRENT_CONTEXT_AND_NEXT_ACTION.md 90_RESEARCH_QUEUE/INITIAL_RESEARCH_QUEUE.csv 95_RESEARCH/LIABILITY/AI-LAWS-R012_CLOSEOUT_2026-09-14.md
          git diff --cached --check
          git commit -m 'control(r012): reconcile state and cleanup helper'
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git push origin HEAD:main
          printf 'FINAL_HEAD=%s\nFINAL_TREE=%s\nHELPER_PRESENT=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" "$(test -e .github/workflows/r012-temporary-source-probe.yml && echo YES || echo NO)"
