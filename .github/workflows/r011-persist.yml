name: AI-LAWS R011 persist human sovereignty baseline

on:
  push:
    paths:
      - '.github/workflows/r011-persist.yml'

permissions:
  contents: write

jobs:
  persist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fresh drift gate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          echo 'R011_DRIFT_GATE=PASS'
      - name: Reconcile queue context and NB06 routing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import csv, io

          root = Path('.')

          qpath = root / '90_RESEARCH_QUEUE/INITIAL_RESEARCH_QUEUE.csv'
          rows = list(csv.DictReader(qpath.read_text(encoding='utf-8').splitlines()))
          fields = ['work_item_id','priority','workstream','scope','state','dependencies','expected_output','stop_condition']
          found = False
          for row in rows:
              if row['work_item_id'] == 'AI-LAWS-R011':
                  found = True
                  row['state'] = 'COMPLETE_RESEARCH_BASELINE_L1_L2_RIGHTS_MAP_SCOPE_LIMITS_OPEN'
                  row['expected_output'] = '50_RIGHTS/AI-LAWS-R011_HUMAN_SOVEREIGNTY_COMPARATIVE_LEGAL_MAP_2026-09-14.md; 50_RIGHTS/AI-LAWS-R011_HUMAN_SOVEREIGNTY_RIGHTS_MATRIX_2026-09-14.csv; 50_RIGHTS/AI-LAWS-R011_SOURCE_AUTHORITY_AND_SCOPE_MATRIX_2026-09-14.csv; 95_RESEARCH/RIGHTS/AI-LAWS-R011_CLOSEOUT_2026-09-14.md'
                  row['stop_condition'] = 'selected comparative L1/L2 rights/protection baseline complete; stop before universal named-right inference, blocked case-law admission, exhaustive jurisdiction expansion, concrete breach/liability or R012'
          assert found
          s = io.StringIO(newline='')
          w = csv.DictWriter(s, fieldnames=fields, lineterminator='\n')
          w.writeheader(); w.writerows(rows)
          qpath.write_text(s.getvalue(), encoding='utf-8')

          ppath = root / '86_NOTEBOOKLM/NOTEBOOKLM_SOURCE_PACK_ASSIGNMENTS.csv'
          prows = list(csv.DictReader(ppath.read_text(encoding='utf-8').splitlines()))
          pfields = ['pack_id','source_id','requirement','reason']
          existing = {(r['pack_id'], r['source_id']) for r in prows}
          additions = [
              {'pack_id':'NB06','source_id':'EU-001','requirement':'RECOMMENDED','reason':'Binding EU AI Act layer for manipulation vulnerability emotion-recognition biometric-categorisation and transparency; phased application labels required'},
              {'pack_id':'NB06','source_id':'INT-001','requirement':'RECOMMENDED','reason':'AI human-rights dignity autonomy remedies and procedural-safeguards treaty interface; R004 entry-into-force state must remain explicit'},
          ]
          for item in additions:
              if (item['pack_id'], item['source_id']) not in existing:
                  prows.append(item)
          s = io.StringIO(newline='')
          w = csv.DictWriter(s, fieldnames=pfields, lineterminator='\n')
          w.writeheader(); w.writerows(prows)
          ppath.write_text(s.getvalue(), encoding='utf-8')

          cpath = root / '00_CONTROL/CURRENT_CONTEXT_AND_NEXT_ACTION.md'
          ctx = cpath.read_text(encoding='utf-8')
          old_state = ' / R010_KR_JP_L1_L2_COMPLETE_KR_POLICY_SOURCE_OPEN / R021_COMPLETE'
          new_state = ' / R010_KR_JP_L1_L2_COMPLETE_KR_POLICY_SOURCE_OPEN / R011_HUMAN_SOVEREIGNTY_L1_L2_COMPLETE_SCOPE_LIMITS_OPEN / R021_COMPLETE'
          if 'R011_HUMAN_SOVEREIGNTY_L1_L2_COMPLETE_SCOPE_LIMITS_OPEN' not in ctx:
              assert old_state in ctx
              ctx = ctx.replace(old_state, new_state, 1)

          completed = 'AI-LAWS-R010 = COMPLETE_RESEARCH_BASELINE_L1_L2_CURRENTNESS_OPEN\n'
          r011_completed = 'AI-LAWS-R011 = COMPLETE_RESEARCH_BASELINE_L1_L2_RIGHTS_MAP_SCOPE_LIMITS_OPEN\n'
          if r011_completed not in ctx:
              assert completed in ctx
              ctx = ctx.replace(completed, completed + r011_completed, 1)

          if '### R011 — Human sovereignty comparative rights baseline' not in ctx:
              section = (
                  '\n### R011 — Human sovereignty comparative rights baseline\n\n'
                  'R011 established a selected-source comparative map for dignity, mental integrity, privacy/data protection, manipulation/vulnerability exploitation, biometric/emotion inference, automated-decision safeguards, contestability/remedies, and Chile-specific brain-activity protection. It does not create a universal named cognitive-liberty right.\n\n'
                  '```text\n'
                  'R011_CONTROLLED_SOURCE_RECORDS = 8\n'
                  'R011_EU_BINDING_PRIMARY_SOURCES = 3\n'
                  'R011_CHILE_BINDING_PRIMARY_SOURCE_ANCHORS = 1\n'
                  'R011_CETS225_TREATY_STATUS_GATE = R004_NOT_TREATY_WIDE_IN_FORCE\n'
                  'R011_UNESCO_SOFT_LAW_SOURCES = 2\n'
                  'R011_CL002_CASE_LAW_ADMISSION = BLOCKED\n'
                  'R011_SELECTED_EU_EXACT_COGNITIVE_LIBERTY_TERM_COUNT = 0\n'
                  'R011_UNIVERSAL_COGNITIVE_LIBERTY_RIGHT = NOT_INFERRED\n'
                  'R011_NEW_SOURCE_BINARY_DOWNLOADS = 0\n'
                  'R011_NOTEBOOK_UPLOADS = 0\n'
                  'R011_LIABILITY_CONCLUSION = NOT_ATTEMPTED\n'
                  '```\n\n'
                  'Durable outputs are under `50_RIGHTS/` plus `95_RESEARCH/RIGHTS/AI-LAWS-R011_CLOSEOUT_2026-09-14.md`.\n\n'
                  '`DIRECT_NEURAL_OR_BRAIN_ACTIVITY_DATA != ORDINARY_BEHAVIOURAL_INFERENCE`, `SELECTED_SOURCE_TERM_NOT_FOUND != UNIVERSAL_RIGHT_DOES_NOT_EXIST`, and `OFFICIAL_DOCKET_IDENTITY != FULL_TEXT_VERIFIED` remain controlling boundaries.\n'
              )
              marker = '\n### R021'
              assert marker in ctx
              ctx = ctx.replace(marker, section + marker, 1)

          integrity_header = ctx.find('## 10. Current integrity state')
          assert integrity_header >= 0
          if 'R011_CONTROLLED_SOURCE_RECORDS = 8' not in ctx[integrity_header:]:
              integrity = (
                  'R011_CONTROLLED_SOURCE_RECORDS = 8\n'
                  'R011_CL002_CASE_LAW_ADMISSION = BLOCKED\n'
                  'R011_UNIVERSAL_COGNITIVE_LIBERTY_RIGHT = NOT_INFERRED\n'
                  'R011_NEW_SOURCE_BINARY_DOWNLOADS = 0\n'
                  'R011_NOTEBOOK_UPLOADS = 0\n'
                  'R011_LIABILITY_CONCLUSION = NOT_ATTEMPTED\n'
              )
              marker = 'NOTEBOOK_UPLOAD_COUNT = 0\n'
              assert marker in ctx
              ctx = ctx.replace(marker, integrity + marker, 1)
          cpath.write_text(ctx.rstrip() + '\n', encoding='utf-8')

          print('R011_RECONCILIATION_GENERATION=PASS')
          print('ZIP_OR_ARTIFACT_CREATED=NO')
          print('NEW_SOURCE_BINARY_DOWNLOADS=0')
          print('NOTEBOOK_UPLOADS=0')
          print('AUTO_ADVANCE=NO')
          PY
      - name: Validate durable R011 state
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -f 50_RIGHTS/AI-LAWS-R011_HUMAN_SOVEREIGNTY_COMPARATIVE_LEGAL_MAP_2026-09-14.md
          test -f 50_RIGHTS/AI-LAWS-R011_HUMAN_SOVEREIGNTY_RIGHTS_MATRIX_2026-09-14.csv
          test -f 50_RIGHTS/AI-LAWS-R011_SOURCE_AUTHORITY_AND_SCOPE_MATRIX_2026-09-14.csv
          test -f 95_RESEARCH/RIGHTS/AI-LAWS-R011_CLOSEOUT_2026-09-14.md
          grep -q '^AI-LAWS-R011,P0,Human sovereignty,.*COMPLETE_RESEARCH_BASELINE_L1_L2_RIGHTS_MAP_SCOPE_LIMITS_OPEN' 90_RESEARCH_QUEUE/INITIAL_RESEARCH_QUEUE.csv
          grep -q '^NB06,EU-001,RECOMMENDED,' 86_NOTEBOOKLM/NOTEBOOKLM_SOURCE_PACK_ASSIGNMENTS.csv
          grep -q '^NB06,INT-001,RECOMMENDED,' 86_NOTEBOOKLM/NOTEBOOKLM_SOURCE_PACK_ASSIGNMENTS.csv
          grep -q 'CL002_CASE_LAW_ADMISSION = BLOCKED' 95_RESEARCH/RIGHTS/AI-LAWS-R011_CLOSEOUT_2026-09-14.md
          grep -q 'UNIVERSAL_COGNITIVE_LIBERTY_RIGHT = NOT_INFERRED' 95_RESEARCH/RIGHTS/AI-LAWS-R011_CLOSEOUT_2026-09-14.md
          grep -q 'SELECTED_SOURCE_TERM_NOT_FOUND != UNIVERSAL_RIGHT_DOES_NOT_EXIST' 50_RIGHTS/AI-LAWS-R011_HUMAN_SOVEREIGNTY_COMPARATIVE_LEGAL_MAP_2026-09-14.md
          grep -q 'R011_HUMAN_SOVEREIGNTY_L1_L2_COMPLETE_SCOPE_LIMITS_OPEN' 00_CONTROL/CURRENT_CONTEXT_AND_NEXT_ACTION.md
          grep -q '^AI-LAWS-R012,P0,Liability,.*READY_RESEARCH' 90_RESEARCH_QUEUE/INITIAL_RESEARCH_QUEUE.csv
          echo 'R011_DURABLE_VALIDATION=PASS'
      - name: Commit and push reconciliation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 90_RESEARCH_QUEUE/INITIAL_RESEARCH_QUEUE.csv 00_CONTROL/CURRENT_CONTEXT_AND_NEXT_ACTION.md 86_NOTEBOOKLM/NOTEBOOKLM_SOURCE_PACK_ASSIGNMENTS.csv
          git diff --cached --check
          git status --short
          git commit -m 'control(r011): reconcile rights baseline state'
          git push origin HEAD:main
      - name: Controlled stop
        shell: bash
        run: |
          echo 'ZIP_OR_ARTIFACT_CREATED=NO'
          echo 'NEW_SOURCE_BINARY_DOWNLOADS=0'
          echo 'DERIVED_MARKDOWN_CREATED=0'
          echo 'NOTEBOOK_UPLOADS=0'
          echo 'CASE_LAW_ADMITTED=0'
          echo 'LIABILITY_CONCLUSION=NOT_ATTEMPTED'
          echo 'AUTO_ADVANCE=NO'
          echo 'STOP=YES'
