name: AI-LAWS R008 NPC law-database resolver

on:
  push:
    paths:
      - '.github/workflows/r008-cn-lawdb-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Inspect NPC official law database surface
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request,re,urllib.parse
          base='https://flk.npc.gov.cn/'
          req=urllib.request.Request(base,headers={'User-Agent':'Mozilla/5.0 AI-LAWS-R008'})
          try:
              with urllib.request.urlopen(req,timeout=15) as r:
                  b=r.read(); t=b.decode('utf-8','ignore')
                  print('HOME_STATUS=',r.status,'BYTES=',len(b),'FINAL=',r.geturl())
                  scripts=re.findall(r'<script[^>]+src=["\']([^"\']+)',t,re.I)
                  print('SCRIPTS=',scripts[:30])
                  for s in scripts[:12]:
                      u=urllib.parse.urljoin(base,s)
                      try:
                          rq=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0 AI-LAWS-R008'})
                          with urllib.request.urlopen(rq,timeout=15) as rr:
                              x=rr.read().decode('utf-8','ignore')
                              hits=[]
                              for pat in [r'https?://[^"\']+',r'/api/[^"\']+',r'api/[A-Za-z0-9_?&=/.-]+',r'search[A-Za-z0-9_?&=/.-]*']:
                                  for m in re.findall(pat,x,re.I):
                                      if any(k in m.lower() for k in ['api','search','law','flk']) and m not in hits: hits.append(m)
                              if hits: print('JS=',u,'HITS=',hits[:40])
                      except Exception as e: print('JS_ERROR=',u,type(e).__name__,str(e))
          except Exception as e: print('HOME_ERROR=',type(e).__name__,str(e))
          PY
      - name: Probe known/likely current official instrument URLs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request,re,html
          candidates={
            'LABEL_CAC':'https://www.cac.gov.cn/2025-03/14/c_1743654684782215.htm',
            'NETWORK_DATA_GOV':'https://www.gov.cn/zhengce/content/202409/content_6977766.htm',
          }
          for k,u in candidates.items():
              print('\n===',k,'===',u)
              req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0 AI-LAWS-R008'})
              try:
                  with urllib.request.urlopen(req,timeout=15) as r:
                      b=r.read(); t=b.decode('utf-8','ignore'); clean=html.unescape(re.sub(r'<[^>]+>',' ',t)); clean=re.sub(r'\s+',' ',clean)
                      print('STATUS=',r.status,'BYTES=',len(b),'FINAL=',r.geturl(),'TITLE=',re.findall(r'<title[^>]*>(.*?)</title>',t,re.I|re.S)[:1])
                      for m in ['人工智能生成合成内容标识办法','2025年9月1日','网络数据安全管理条例','2025年1月1日']:
                          print('MARKER',m,m in clean)
              except Exception as e: print('ERROR=',type(e).__name__,str(e))
          PY
          echo 'ZIP_OR_ARTIFACT_CREATED=NO'
