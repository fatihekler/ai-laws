name: AI-LAWS R008 China official-law resolver probe

on:
  push:
    paths:
      - '.github/workflows/r008-cn-official-source-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Probe exact known CAC sources and candidate current instruments
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request,re,html
          urls=[
            'https://www.cac.gov.cn/2022-01/04/c_1642894606364259.htm',
            'https://www.cac.gov.cn/2022-12/11/c_1672221949354811.htm',
            'https://www.cac.gov.cn/2023-07/13/c_1690898327029107.htm',
            'https://www.cac.gov.cn/2025-03/14/c_1743654684782215.htm',
            'https://www.gov.cn/zhengce/content/202409/content_6977766.htm',
            'https://flk.npc.gov.cn/',
          ]
          for u in urls:
              print('\nURL=',u)
              req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0 AI-LAWS-R008'})
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      b=r.read(); t=b.decode('utf-8','ignore')
                      clean=html.unescape(re.sub(r'<[^>]+>',' ',t)); clean=re.sub(r'\s+',' ',clean)
                      print('FINAL=',r.geturl(),'STATUS=',r.status,'TYPE=',r.headers.get('content-type'),'BYTES=',len(b))
                      print('TITLE=',re.findall(r'<title[^>]*>(.*?)</title>',t,re.I|re.S)[:1])
                      for m in ['人工智能生成合成内容标识办法','网络数据安全管理条例','中华人民共和国个人信息保护法','中华人民共和国数据安全法','中华人民共和国网络安全法','2025年9月1日','2025年1月1日','2026年1月1日']:
                          if m in clean:
                              i=clean.find(m); print('MARKER=',m,'SAMPLE=',clean[max(0,i-140):i+360])
              except Exception as e: print('ERROR=',type(e).__name__,str(e))
          PY
      - name: Discover exact official URLs using search pages only as locators
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.parse,urllib.request,re,html
          queries=[
            '中华人民共和国个人信息保护法 npc.gov.cn',
            '中华人民共和国数据安全法 npc.gov.cn',
            '中华人民共和国网络安全法 2025 修改 npc.gov.cn',
            '人工智能生成合成内容标识办法 cac.gov.cn',
            '网络数据安全管理条例 gov.cn',
          ]
          engines=['https://www.google.com/search?q=','https://html.duckduckgo.com/html/?q=']
          for q in queries:
              print('\nQUERY=',q)
              seen=[]
              for base in engines:
                  try:
                      req=urllib.request.Request(base+urllib.parse.quote(q),headers={'User-Agent':'Mozilla/5.0 AI-LAWS-R008'})
                      with urllib.request.urlopen(req,timeout=30) as r:
                          t=html.unescape(r.read().decode('utf-8','ignore'))
                          for m in re.finditer(r'https?://[^\s"\'<>]+',t,re.I):
                              u=m.group(0).replace('&amp;','&')
                              if any(h in u for h in ['npc.gov.cn','flk.npc.gov.cn','cac.gov.cn','gov.cn']) and u not in seen:
                                  seen.append(u)
                  except Exception as e: print('ENGINE_ERROR=',base,type(e).__name__,str(e))
              print('OFFICIAL_CANDIDATES=',seen[:30])
          PY
          echo 'ZIP_OR_ARTIFACT_CREATED=NO'
