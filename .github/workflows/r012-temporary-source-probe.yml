## 3. Actor translation firewall

The AI Act defines provider, deployer, importer, distributor, authorised representative, product manufacturer and the collective term operator. These regulatory roles are useful for actor identification, but they do not automatically identify the civil-liability defendant.

The Product Liability Directive uses a different chain: manufacturer of a product or component, provider of a related service, authorised representative, importer, fulfilment service provider, distributor, specified online-platform provider, and a person that substantially modifies a product in the defined circumstances.

GDPR uses controller and processor roles for its Article 82 compensation route.

Therefore:

```text
AI_ACT_PROVIDER != AUTOMATIC_PLD_MANUFACTURER
AI_ACT_DEPLOYER != AUTOMATIC_TORT_DEFENDANT
TOOL_PROVIDER != AUTOMATIC_COMPONENT_MANUFACTURER
AGENT_OPERATOR != AUTOMATIC_CONTROLLER_OR_PROCESSOR
ROLE_MAPPING_REQUIRES_FACTS_AND_APPLICABLE_LAW
```

## 4. EU product-liability architecture

### Product and software

`EU-003` Article 4 includes software within the Directive's definition of product. Its manufacturer-control concept expressly addresses integration/supply of components, software updates/upgrades, modification and the ability to supply updates/upgrades. This makes software lifecycle control legally relevant within the Directive's architecture; it does not make every AI service a defective product.

### Defectiveness

Article 7 uses the safety a person is entitled to expect or that Union/national law requires, assessed across all circumstances. The controlled text expressly includes reasonably foreseeable use, a product's ability to continue learning or acquire features after market placement/service, foreseeable effects of interconnection, timing/control, product-safety and cybersecurity requirements, interventions/recalls and user-group needs.

```text
AI_OUTPUT_ERROR != DEFECT_AUTOMATICALLY
REGULATORY_NONCOMPLIANCE != CIVIL_LIABILITY_AUTOMATICALLY
BETTER_MODEL_EXISTS != DEFECT_AUTOMATICALLY
```

### Potential liable economic operators

Article 8 sets a product-chain allocation architecture. Depending on its conditions, liability may attach to the manufacturer of a defective product, a causally relevant defective component manufacturer, and defined Union-side operators where a manufacturer is outside the Union. A substantial modifier may be treated as manufacturer. Distributor and specified online-platform routes depend on the Directive's identification and platform conditions.

This is a legal role map, not a finding that a model developer, deployer, agent operator or tool provider satisfies any one role in a concrete case.

### Causation and evidence

Article 10 retains a claimant's baseline requirement to prove defectiveness, damage and causal link, while establishing rebuttable presumptions in specified circumstances. Those include defined failures to disclose evidence, non-compliance with mandatory product-safety requirements protecting against the relevant risk, obvious malfunction, typical consistency between defect and damage, and technically/scientifically complex proof situations meeting the Directive's likelihood threshold.

Article 9 creates controlled disclosure mechanisms subject to plausibility, necessity, proportionality, confidentiality/trade-secret protection and national procedural law.

R012 records these elements but does not replace the dedicated R014 evidence/procedure unit.

### Damage and remedy

Articles 5–6 establish the Directive's compensation route for defined damage caused by a defective product, including death/personal injury, medically recognised psychological injury, specified property damage and destruction/corruption of non-professional data, with national-law dependencies for some losses and other liability regimes preserved.

### Defences and allocation

Article 11 states defined exemptions and limits them in specified software/update/control circumstances. Articles 12–15 address multiple liable economic operators, contribution/recourse, injured-person fault and non-excludability against the injured person. These rules remain instrument-specific and transposition-dependent.

Article 8(5) permits Member States to use existing or establish national compensation schemes in specified non-recovery/insolvency circumstances. It does **not** establish a mandatory EU-wide AI catastrophe fund.

## 5. Product Liability Directive date-state gate

`EU-003` Article 22 requires Member States to transpose by **2026-12-09**. Article 21 repeals Directive 85/374/EEC from that date while preserving the earlier Directive for products placed on the market or put into service before that date.

On the R012 research date, 2026-09-14:

```text
PLD_2024_TEXT = VERIFIED_PRIMARY_SOURCE
TRANSPOSITION_DEADLINE = FUTURE_2026-12-09
MEMBER_STATE_TRANSPOSITION_MAP = NOT_ATTEMPTED
UNIFORM_CURRENT_NATIONAL_IMPLEMENTATION = NOT_INFERRED
```

R012 therefore uses the Directive to map the Union legislative architecture but does not state that every Member State already applies its new rules identically.

## 6. GDPR Article 82 route

`EU-005` Article 82 supplies a distinct compensation/liability route for material or non-material damage resulting from infringement of the GDPR. Controllers and processors have different liability triggers; Article 82 also contains a responsibility-based exemption, whole-damage protection where multiple responsible actors are involved, and recourse allocation.

This route is not interchangeable with product liability:

```text
GDPR_INFRINGEMENT != PRODUCT_DEFECT
GDPR_DAMAGE != PLAINLY_PLD_DAMAGE
GDPR_ART82_ROUTE != AI_ACT_FINE_ARCHITECTURE
MULTIPLE_RESPONSIBLE_CONTROLLERS != EVERY_AI_SUPPLY_CHAIN_ACTOR
```

A concrete AI dispute may engage more than one legal regime, but each route requires its own scope, actor, breach/infringement, causation, damage and remedy analysis.

## 7. AI Act duty interface

`EU-001` supplies actor definitions and current regulatory duties, but R003 already established the controlling boundary:

```text
AI_ACT_VIOLATION != PRIVATE_RIGHT_OF_ACTION
REGULATORY_FINE_ARCHITECTURE != CIVIL_DAMAGES_RULE
AI_ACT_COMPLIANCE != PRODUCT_LIABILITY_DEFENCE
```

A mandatory AI/product-safety rule may be relevant to defect or evidence analysis only where the exact system, actor, provision, applicability date, protected risk and applicable private-law route are established. R012 does not infer that interface generically.

## 8. United States controlled-source result

The controlled federal `US-001..US-008` layer is composed of executive orders, policy plans, OMB memoranda and voluntary NIST material. R007 expressly did not build an exhaustive federal/state tort, product-liability or private-right-of-action corpus.

Fresh R012 probes confirm that selected OMB/NIST endpoints remain accessible, but source availability does not convert those instruments into generally applicable civil-liability statutes.

Utah Chapter 72 Section 101 remains a verified current source anchor at the previously bounded level. Whole-chapter section-by-section currentness and any private liability/remedy route remain open.

Accordingly:

```text
US_GENERAL_AI_TORT_RULE = NOT_ESTABLISHED_BY_CONTROLLED_R012_SET
NIST_FRAMEWORK != STATUTE
OMB_MEMORANDUM != GENERAL_PRIVATE_TORT_DUTY
EXECUTIVE_POLICY != PRIVATE_RIGHT_OF_ACTION
UTAH_SECTION101_CURRENT != WHOLE_CHAPTER_LIABILITY_ANALYSIS_COMPLETE
```

This is a controlled-source insufficiency finding, **not** a finding that U.S. tort/product/consumer/privacy law cannot apply to AI harms.

## 9. Comparative liability chain

For every future concrete record, preserve:

```text
ACTOR
DUTY
BREACH
CAUSATION
DAMAGE
REMEDY
DEFENCE
EVIDENCE
JURISDICTION
DATE_STATE
```

The R012 matrix records only what the controlled sources can support. A missing element remains `UNKNOWN` or `NOT_ATTEMPTED` rather than being borrowed from another regime.

## 10. Open dependencies

R012 does not resolve:

- EU Member-State transposition of Directive (EU) 2024/2853;
- national civil-procedure, damages, contribution and recourse details beyond the controlled EU texts;
- CJEU/national case law applying the new Product Liability Directive to AI/software;
- exhaustive U.S. federal or 50-state tort/product/privacy/consumer liability;
- actor-specific duties for an actual model developer, deployer, agent operator or tool provider;
- a concrete breach, defect, infringement, causal chain, compensable damage or remedy entitlement;
- Türkiye R005/R006 blockers;
- incident-specific R019 analysis;
- insurance/catastrophe-fund analysis reserved for R013;
- full evidence/procedure comparison reserved for R014.

