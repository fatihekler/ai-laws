name: AI-LAWS R010 KR-JP structured-source probe

on:
  push:
    paths:
      - '.github/workflows/r010-kr-jp-official-source-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Resolve structured Korea and Japan law metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request, urllib.parse, re, html, json, xml.etree.ElementTree as ET
          UA={'User-Agent':'Mozilla/5.0 AI-LAWS-R010','Accept':'text/html,application/json,application/xml,*/*'}
          def fetch(url, timeout=30):
              req=urllib.request.Request(url,headers=UA)
              with urllib.request.urlopen(req,timeout=timeout) as r:
                  b=r.read(); return r.status,r.geturl(),r.headers.get('Content-Type',''),b
          def ptext(raw):
              s=raw.decode('utf-8','ignore') if isinstance(raw,(bytes,bytearray)) else raw
              s=re.sub(r'<script[\s\S]*?</script>',' ',s,flags=re.I)
              s=re.sub(r'<style[\s\S]*?</style>',' ',s,flags=re.I)
              return re.sub(r'\s+',' ',html.unescape(re.sub(r'<[^>]+>',' ',s))).strip()
          def kr_name_url(name): return 'https://www.law.go.kr/'+urllib.parse.quote('법령/'+name,safe='/')

          print('=== KOREA RAW REDIRECTION / IDENTIFIERS ===')
          for sid,name in [('KR-001','인공지능 발전과 신뢰 기반 조성 등에 관한 기본법'),('KR-002','개인정보 보호법')]:
              try:
                  st,fu,ct,b=fetch(kr_name_url(name)); raw=b.decode('utf-8','ignore')
                  print('\n',sid,'STATUS=',st,'FINAL=',fu,'BYTES=',len(b))
                  print('RAW=',raw[:5000])
                  for pat in [r'lsiSeq[^0-9]{0,20}([0-9]+)',r'lsId[^A-Za-z0-9]{0,20}([A-Za-z0-9]+)',r'efYd[^0-9]{0,20}([0-9]{8})',r'공포번호[^0-9]{0,20}([0-9]+)',r'시행일[^0-9]{0,20}([0-9]{4}[^<]{0,30})']:
                      print('PAT',pat,'=',re.findall(pat,raw,re.I)[:10])
              except Exception as e: print(sid,'ERROR=',type(e).__name__,str(e))

          print('\n=== KOREA SEARCH ENDPOINTS ===')
          q='인공지능 발전과 신뢰 기반 조성 등에 관한 기본법'
          candidates=[
            'https://www.law.go.kr/lsSc.do?'+urllib.parse.urlencode({'query':q}),
            'https://www.law.go.kr/LSW/lsSc.do?'+urllib.parse.urlencode({'query':q}),
            'https://www.law.go.kr/lsSc.do?menuId=1&subMenuId=15&tabMenuId=81&'+urllib.parse.urlencode({'query':q}),
          ]
          for u in candidates:
              try:
                  st,fu,ct,b=fetch(u); raw=b.decode('utf-8','ignore'); print('URL=',u,'STATUS=',st,'FINAL=',fu,'BYTES=',len(b));
                  print('TEXT=',ptext(raw)[:3000]);
                  print('LSISEQ=',re.findall(r'lsiSeq[=:\\"\' ]+([0-9]+)',raw,re.I)[:20])
              except Exception as e: print('SEARCH_ENDPOINT_ERROR=',u,type(e).__name__,str(e))

          print('\n=== JAPAN E-GOV API LAW DATA ===')
          for sid,lawid in [('JP-001','507AC0000000053'),('JP-002','415AC0000000057')]:
              for base in ['https://laws.e-gov.go.jp/api/1/lawdata/','https://laws.e-gov.go.jp/api/2/law_data/']:
                  u=base+lawid
                  try:
                      st,fu,ct,b=fetch(u); raw=b.decode('utf-8','ignore')
                      print('\n',sid,'URL=',u,'STATUS=',st,'CT=',ct,'BYTES=',len(b))
                      print('HEAD=',raw[:4500])
                      print('PLAIN=',ptext(raw)[:2800])
                  except Exception as e: print(sid,'API_ERROR=',u,type(e).__name__,str(e))

          print('\n=== JAPAN CABINET OFFICE AI HUB LINKS ===')
          hub='https://www8.cao.go.jp/cstp/ai/index.html'
          try:
              st,fu,ct,b=fetch(hub); raw=b.decode('utf-8','ignore')
              links=[]
              for href,label in re.findall(r'<a[^>]+href=["\']([^"\']+)["\'][^>]*>(.*?)</a>',raw,re.I|re.S):
                  lab=ptext(label)
                  if any(k in lab for k in ['人工知能関連技術','人工知能基本計画','適正性確保','AI事業者','ガイドライン']):
                      links.append((lab,urllib.parse.urljoin(hub,html.unescape(href))))
              print('LINKS=',json.dumps(links,ensure_ascii=False))
              for lab,u in links[:12]:
                  try:
                      s2,f2,c2,b2=fetch(u); print('\nLABEL=',lab,'URL=',u,'STATUS=',s2,'FINAL=',f2,'CT=',c2,'BYTES=',len(b2)); print('TEXT=',ptext(b2)[:3500])
                  except Exception as e: print('LINK_ERROR=',lab,u,type(e).__name__,str(e))
          except Exception as e: print('HUB_ERROR=',type(e).__name__,str(e))

          print('\n=== KOREA MSIT TARGETED LIST SEARCH ===')
          base='https://www.msit.go.kr/eng/bbs/list.do'
          for term in ['AI Basic Act','Artificial Intelligence Basic Act','Artificial Intelligence Act','AI Framework Act']:
              params={'sCode':'eng','mId':'4','mPid':'2','searchOpt':'ALL','searchTxt':term}
              try:
                  st,fu,ct,b=fetch(base+'?'+urllib.parse.urlencode(params)); raw=b.decode('utf-8','ignore');
                  print('TERM=',term,'STATUS=',st,'BYTES=',len(b),'HAS_TERM=',term.lower() in ptext(raw).lower())
                  # Print rows / hrefs carrying AI/basic-law wording.
                  hits=[]
                  for href,label in re.findall(r'<a[^>]+href=["\']([^"\']+)["\'][^>]*>(.*?)</a>',raw,re.I|re.S):
                      lab=ptext(label)
                      if any(k in lab.lower() for k in ['artificial intelligence','ai basic','ai framework']): hits.append((lab,urllib.parse.urljoin(fu,html.unescape(href))))
                  print('HITS=',json.dumps(hits[:20],ensure_ascii=False))
              except Exception as e: print('MSIT_SEARCH_ERROR=',term,type(e).__name__,str(e))

          print('\nZIP_OR_ARTIFACT_CREATED=NO')
          print('BINARY_DOWNLOADS=0')
          print('AUTO_ADVANCE=NO')
          PY
