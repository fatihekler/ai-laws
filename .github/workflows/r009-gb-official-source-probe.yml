name: AI-LAWS R009 UK enactment-date metadata probe

on:
  push:
    paths:
      - '.github/workflows/r009-gb-official-source-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact enactment-date attributes without inferring commencement
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request,re
          UA={'User-Agent':'Mozilla/5.0 AI-LAWS-R009','Accept':'application/xml,text/xml,*/*'}
          sources={
            'GB-001':'https://www.legislation.gov.uk/eur/2016/679/data.xml',
            'GB-002':'https://www.legislation.gov.uk/ukpga/2018/12/data.xml',
            'GB-003':'https://www.legislation.gov.uk/ukpga/2025/18/data.xml',
            'GB-004':'https://www.legislation.gov.uk/ukpga/2023/50/data.xml',
            'GB-005':'https://www.legislation.gov.uk/ukpga/2024/13/data.xml',
            'GB-006':'https://www.legislation.gov.uk/ukpga/2015/15/data.xml',
            'GB-007':'https://www.legislation.gov.uk/ukpga/1987/43/data.xml',
            'GB-008':'https://www.legislation.gov.uk/ukpga/2025/20/data.xml',
          }
          for sid,u in sources.items():
              print('\n===',sid,'===')
              try:
                  req=urllib.request.Request(u,headers=UA)
                  with urllib.request.urlopen(req,timeout=25) as r:
                      x=r.read().decode('utf-8','ignore')
                      tags=re.findall(r'<[^>]*(?:EnactmentDate|MadeDate|ComingIntoForce)[^>]*>',x,re.I)
                      print('STATUS=',r.status,'FINAL=',r.geturl(),'DATE_TAGS=',tags[:20])
                      for attr in ['EnactmentDate','MadeDate','ComingIntoForce']:
                          vals=[]
                          for tag in tags:
                              if attr.lower() in tag.lower():
                                  vals += re.findall(r'(?:Date|date)=["\']([^"\']+)["\']',tag)
                          print(attr,'=',vals)
              except Exception as e: print('ERROR=',type(e).__name__,str(e))
          PY
          echo 'COMMENCEMENT_INFERENCE_FROM_ENACTMENT_DATE=NO'
          echo 'ZIP_OR_ARTIFACT_CREATED=NO'
