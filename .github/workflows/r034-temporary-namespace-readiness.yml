name: R034 final namespace reconciliation cleanup

on:
  push:
    paths:
      - '.github/workflows/r034-temporary-namespace-readiness.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact trigger state
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail closed on drift
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"

      - name: Reconcile controlled state
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/r034_reconcile.py
          git diff --check
          test "$(find 86_NOTEBOOKLM/downloads -maxdepth 1 -type f -iname '*.pdf' | wc -l)" -eq 38
          test "$(awk -F, 'NR>1 && $10=="YES" {n++} END {print n+0}' 86_NOTEBOOKLM/downloads/RENAME_MANIFEST.csv)" -eq 0
          grep -q 'AI-LAWS-R034' 90_RESEARCH_QUEUE/INITIAL_RESEARCH_QUEUE.csv
          grep -q 'CORE_NOTEBOOK_INGESTION_READY = YES' 95_RESEARCH/NOTEBOOK_READINESS/AI-LAWS-R034_CLOSEOUT_2026-09-14.md

      - name: Commit reconciliation cleanup and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Fatih Mehmet Ekler'
          git config user.email '5189511+fatihekler@users.noreply.github.com'
          git rm .github/workflows/r034-temporary-namespace-readiness.yml .github/scripts/r034_namespace_readiness.py .github/scripts/r034_reconcile.py
          git add 00_CONTROL/CURRENT_CONTEXT_AND_NEXT_ACTION.md 90_RESEARCH_QUEUE/INITIAL_RESEARCH_QUEUE.csv 95_RESEARCH/NOTEBOOK_READINESS/AI-LAWS-R034_CLOSEOUT_2026-09-14.md
          git diff --cached --check
          git commit -m 'control(r034): reconcile namespace readiness and cleanup helpers'
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git push origin HEAD:main
          printf 'FINAL_HEAD=%s\nFINAL_TREE=%s\nWORKFLOW_PRESENT=%s\nNAMESPACE_SCRIPT_PRESENT=%s\nRECONCILE_PRESENT=%s\n' \
            "$(git rev-parse HEAD)" \
            "$(git rev-parse HEAD^{tree})" \
            "$(test -e .github/workflows/r034-temporary-namespace-readiness.yml && echo YES || echo NO)" \
            "$(test -e .github/scripts/r034_namespace_readiness.py && echo YES || echo NO)" \
            "$(test -e .github/scripts/r034_reconcile.py && echo YES || echo NO)"
