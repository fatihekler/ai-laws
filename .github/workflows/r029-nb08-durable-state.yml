            'INC-002':dict(variant='INDEPENDENT_INVESTIGATION_OFFICIAL_METR_PDF_EXACT_MATCH',identity='CONTENT_IDENTITY_VERIFIED',current='FIXED_2026-08-26_INVESTIGATION; OFFICIAL_METR_PDF_EXACT_BYTE_MATCH_2026-09-14',ingest='VERIFIED_OFFICIAL_PDF_ELIGIBLE; INDEPENDENT_INVESTIGATION_LIMITATIONS_LABEL_REQUIRED',label='INC-002 | US-GLOBAL | INDEPENDENT_INVESTIGATION | METR-Redwood | HF Incident | EXACT-OFFICIAL-PDF',canonical='INC-002__US-GLOBAL__METR-REDWOOD__HF-INCIDENT-INVESTIGATION__2026-08-26.pdf',source_recheck='METR_ORIGINAL_PAGE_AND_DIRECT_PDF_RECHECKED',exact='YES',role='INDEPENDENT_INVESTIGATION',notes='91-page searchable report exactly matches https://metr.org/hugging-face-incident-report-aug-2026.pdf. Preserve the report stated scope, dataset and investigation limitations.'),
