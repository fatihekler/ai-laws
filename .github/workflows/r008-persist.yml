name: AI-LAWS R008 persist China primary-source baseline

on:
  push:
    paths:
      - '.github/scripts/r008_persist.py'
      - '.github/workflows/r008-persist.yml'

permissions:
  contents: write

jobs:
  persist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fresh drift gate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          echo "HEAD=$(git rev-parse HEAD)"
          echo "ORIGIN_MAIN=$(git rev-parse origin/main)"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - name: Generate controlled R008 durable state
        run: python3 .github/scripts/r008_persist.py

      - name: Normalize newly generated R008 Markdown
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          for p in [
            Path('20_JURISDICTIONS/CN/CN_AI_DATA_CYBER_PRIMARY_SOURCE_MAP_2026-09-14.md'),
            Path('95_RESEARCH/CN/AI-LAWS-R008_CLOSEOUT_2026-09-14.md'),
          ]:
              t=p.read_text(encoding='utf-8')
              p.write_text('\n'.join(line.rstrip() for line in t.splitlines())+'\n',encoding='utf-8')
          PY

      - name: Validate and commit R008 durable outputs
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          git diff --check
          test -f 20_JURISDICTIONS/CN/CN_AI_DATA_CYBER_PRIMARY_SOURCE_MAP_2026-09-14.md
          test -f 20_JURISDICTIONS/CN/CN_PRIMARY_SOURCE_INVENTORY_2026-09-14.csv
          test -f 20_JURISDICTIONS/CN/CN_CURRENTNESS_AND_BINDING_STATE_MATRIX.csv
          test -f 95_RESEARCH/CN/AI-LAWS-R008_CLOSEOUT_2026-09-14.md
          test "$(($(wc -l < 20_JURISDICTIONS/CN/CN_PRIMARY_SOURCE_INVENTORY_2026-09-14.csv)-1))" -eq 8
          grep -q 'CN-006' 20_JURISDICTIONS/CN/CN_PRIMARY_SOURCE_INVENTORY_2026-09-14.csv
          grep -q '2026-01-01' 20_JURISDICTIONS/CN/CN_CURRENTNESS_AND_BINDING_STATE_MATRIX.csv
          grep -q 'COMPLETE_RESEARCH_BASELINE_L1_PRIMARY_SOURCE_MAP' 90_RESEARCH_QUEUE/INITIAL_RESEARCH_QUEUE.csv
          grep -q 'R008_CN_PRIMARY_SOURCE_MAP_L1_COMPLETE' 00_CONTROL/CURRENT_CONTEXT_AND_NEXT_ACTION.md
          grep -q 'NB05_CN_OFFICIAL_URL_SOURCE_SET = READY_8' 86_NOTEBOOKLM/NOTEBOOKLM_DOWNLOAD_AND_UPLOAD_LIST.md
          grep -q 'CN-008' 86_NOTEBOOKLM/NOTEBOOKLM_SOURCE_ACQUISITION_MANIFEST.csv
          grep -q 'NB-BATCH-NB05-20260914-001,CN-008' 86_NOTEBOOKLM/NOTEBOOKLM_ACQUISITION_AND_VALIDATION_LEDGER.csv
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            00_CONTROL/CURRENT_CONTEXT_AND_NEXT_ACTION.md \
            20_JURISDICTIONS/JURISDICTION_RESEARCH_REGISTRY.csv \
            20_JURISDICTIONS/CN/CN_AI_DATA_CYBER_PRIMARY_SOURCE_MAP_2026-09-14.md \
            20_JURISDICTIONS/CN/CN_PRIMARY_SOURCE_INVENTORY_2026-09-14.csv \
            20_JURISDICTIONS/CN/CN_CURRENTNESS_AND_BINDING_STATE_MATRIX.csv \
            86_NOTEBOOKLM/NOTEBOOKLM_SOURCE_ACQUISITION_MANIFEST.csv \
            86_NOTEBOOKLM/NOTEBOOKLM_SOURCE_PACK_ASSIGNMENTS.csv \
            86_NOTEBOOKLM/NOTEBOOKLM_ACQUISITION_AND_VALIDATION_LEDGER.csv \
            86_NOTEBOOKLM/NOTEBOOKLM_DOWNLOAD_AND_UPLOAD_LIST.md \
            90_RESEARCH_QUEUE/INITIAL_RESEARCH_QUEUE.csv \
            95_RESEARCH/CN/AI-LAWS-R008_CLOSEOUT_2026-09-14.md
          git diff --cached --check
          git diff --cached --quiet && { echo 'NO_DURABLE_CHANGES'; exit 1; }
          git status --short
          git commit -m 'research(r008): establish China primary-source baseline'
          git push origin HEAD:main

      - name: Confirm controlled stop
        run: |
          echo 'R008_STATE=COMPLETE_RESEARCH_BASELINE_L1_PRIMARY_SOURCE_MAP'
          echo 'CN_PRIMARY_SOURCE_COUNT=8'
          echo 'NB05_URL_SOURCE_SET=READY_8'
          echo 'TRANSLATION_CONTROL=AUTHENTIC_CHINESE_PRIMARY_TEXT'
          echo 'CASE_LAW=NOT_ATTEMPTED'
          echo 'LIABILITY_CONCLUSION=NOT_ATTEMPTED'
          echo 'NEW_BINARY_DOWNLOADS=0'
          echo 'NOTEBOOK_UPLOADS=0'
          echo 'ZIP_OR_ARTIFACT_CREATED=NO'
          echo 'AUTO_ADVANCE=NO'
