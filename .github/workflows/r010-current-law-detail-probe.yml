name: AI-LAWS R010 Korea metadata-field probe
on:
  push:
    paths:
      - '.github/workflows/r010-current-law-detail-probe.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Extract official Korea metadata fields
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request,re,html,json
          UA={'User-Agent':'Mozilla/5.0 AI-LAWS-R010'}
          targets={
            'KR-001':'https://www.law.go.kr/LSW//lsInfoP.do?lsiSeq=282791&chrClsCd=010202&urlMode=lsInfoP&efYd=20260721&ancYnChk=0',
            'KR-002':'https://www.law.go.kr/LSW//lsInfoP.do?lsiSeq=288781&chrClsCd=010202&urlMode=lsInfoP&efYd=20260820&ancYnChk=0',
            'KR-003':'https://www.law.go.kr/LSW//lsInfoP.do?lsiSeq=283839&chrClsCd=010202&urlMode=lsInfoP&efYd=20260911&ancYnChk=0',
          }
          for sid,u in targets.items():
              print('\n===',sid,'===')
              req=urllib.request.Request(u,headers=UA)
              with urllib.request.urlopen(req,timeout=60) as r:
                  raw=r.read().decode('utf-8','ignore')
              print('STATUS=200 BYTES=',len(raw.encode('utf-8')))
              fields={}
              for m in re.finditer(r'<input[^>]+(?:id|name)=["\']([^"\']+)["\'][^>]*>',raw,re.I):
                  tag=m.group(0); key=m.group(1)
                  vm=re.search(r'value=["\']([^"\']*)["\']',tag,re.I)
                  if vm and key in {'lsNm','lsId','lsiSeq','ancNo','ancYd','efYd','nwYn','rrClsCd','lsKndCd','orgCd'}:
                      fields.setdefault(key,[]).append(html.unescape(vm.group(1)))
              for key in ['lsNm','lsId','lsiSeq','ancNo','ancYd','efYd','nwYn','rrClsCd','lsKndCd','orgCd']:
                  if key in fields: print(key,'=',list(dict.fromkeys(fields[key]))[:12])
              plain=re.sub(r'\s+',' ',html.unescape(re.sub(r'<[^>]+>',' ',raw))).strip()
              for lab in ['공포번호','공포일자','시행일자','법령종류','소관부처']:
                  pos=plain.find(lab)
                  if pos>=0: print('AROUND_'+lab,'=',plain[pos:pos+900])
              for patname,pat in {
                'LAWNUM_TEXT':r'(법률|대통령령)\s*제\s*[0-9]+\s*호',
                'DATE_YYYYMMDD':r'20[0-9]{2}[.-]?[01][0-9][.-]?[0-3][0-9]',
              }.items():
                  vals=list(dict.fromkeys(re.findall(pat,plain))) if patname=='DATE_YYYYMMDD' else re.findall(pat,plain)
                  print(patname,'=',vals[:30])
          print('\nZIP_OR_ARTIFACT_CREATED=NO')
          print('BINARY_DOWNLOADS=0')
          print('AUTO_ADVANCE=NO')
          PY
