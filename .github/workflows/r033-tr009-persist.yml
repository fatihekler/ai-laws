name: AI-LAWS R033 TR-009 durable state

on:
  push:
    paths:
      - '.github/workflows/r033-tr009-persist.yml'

permissions:
  contents: write

jobs:
  persist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fresh drift gate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          echo "HEAD=$(git rev-parse HEAD)"
          echo "ORIGIN_MAIN=$(git rev-parse origin/main)"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - name: Persist R033 controlled state
        run: python3 .github/scripts/r033_persist.py

      - name: Validate and commit durable state
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          git diff --check
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            00_CONTROL/CURRENT_CONTEXT_AND_NEXT_ACTION.md \
            86_NOTEBOOKLM/NOTEBOOKLM_SOURCE_ACQUISITION_MANIFEST.csv \
            86_NOTEBOOKLM/NOTEBOOKLM_SOURCE_PACK_ASSIGNMENTS.csv \
            86_NOTEBOOKLM/NOTEBOOKLM_ACQUISITION_AND_VALIDATION_LEDGER.csv \
            86_NOTEBOOKLM/NOTEBOOKLM_DOWNLOAD_AND_UPLOAD_LIST.md \
            86_NOTEBOOKLM/downloads/TR009_CURRENT_POLICY_SOURCE_RESULTS.csv \
            86_NOTEBOOKLM/acquisition_runs/AI-LAWS-R033_TR009_CURRENT_POLICY_SOURCE_CLOSEOUT_2026-09-14.md \
            90_RESEARCH_QUEUE/INITIAL_RESEARCH_QUEUE.csv
          git diff --cached --check
          git diff --cached --quiet && { echo 'NO_DURABLE_CHANGES'; exit 1; }
          git commit -m 'validation(r033): pin current Türkiye AI action plan source'
          git push origin HEAD:main

      - name: Confirm controlled stop
        run: |
          echo 'ZIP_OR_ARTIFACT_CREATED=NO'
          echo 'NOTEBOOK_UPLOADS=0'
          echo 'NEW_THIRD_PARTY_BINARY_VENDORED=0'
          echo 'AUTO_ADVANCE=NO'
