name: AI-LAWS R026 final wording fix

on:
  push:
    paths:
      - '.github/workflows/r026-final-wording-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct R026 Markdown rationale
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('00_CONTROL/CURRENT_CONTEXT_AND_NEXT_ACTION.md')
          s=p.read_text(encoding='utf-8')
          old='R024/R025/R026 created no Markdown derivatives because the repository PDF body/text-layer state cannot be established through the current GitHub connector and verified official URLs are available.'
          new='R024/R025 created no Markdown derivatives because repository PDF body/text-layer state was not established in those units and verified official URLs are available. R026 also created no Markdown derivatives, but for a different reason: all eight NB04 repository PDFs have native searchable text layers and no extraction defect requiring a derivative was found.'
          if old not in s: raise SystemExit('target wording not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 00_CONTROL/CURRENT_CONTEXT_AND_NEXT_ACTION.md
          git commit -m 'control(r026): correct NB04 Markdown rationale'
          git push origin HEAD:main
