name: AI-LAWS R008 NPC law-database exact API probe

on:
  push:
    paths:
      - '.github/workflows/r008-cn-lawdb-api-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Query exact NPC official law-search API
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request,json
          endpoint='https://flk.npc.gov.cn/law-search/search/list'
          terms=['中华人民共和国个人信息保护法','中华人民共和国数据安全法','中华人民共和国网络安全法']
          for term in terms:
              print('\nTERM=',term)
              for st in [1,2]:
                  payload={
                    'searchRange':1,
                    'sxrq':[],
                    'gbrq':[],
                    'searchType':st,
                    'sxx':[],
                    'gbrqYear':[],
                    'flfgCodeId':[],
                    'zdjgCodeId':[],
                    'searchContent':term,
                    'pageNum':1,
                    'pageSize':20
                  }
                  data=json.dumps(payload,ensure_ascii=False).encode('utf-8')
                  req=urllib.request.Request(endpoint,data=data,method='POST',headers={
                    'User-Agent':'Mozilla/5.0 AI-LAWS-R008',
                    'Content-Type':'application/json;charset=UTF-8',
                    'Accept':'application/json,text/plain,*/*',
                    'Origin':'https://flk.npc.gov.cn',
                    'Referer':'https://flk.npc.gov.cn/'
                  })
                  try:
                      with urllib.request.urlopen(req,timeout=20) as r:
                          b=r.read(); print('SEARCH_TYPE=',st,'STATUS=',r.status,'BYTES=',len(b)); print(b[:5000].decode('utf-8','ignore'))
                  except Exception as e: print('SEARCH_TYPE=',st,'ERROR=',type(e).__name__,str(e))
          PY
          echo 'ZIP_OR_ARTIFACT_CREATED=NO'
