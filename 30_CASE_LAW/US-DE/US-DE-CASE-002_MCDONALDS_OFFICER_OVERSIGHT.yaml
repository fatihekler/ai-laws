  subject: Corporate officer fiduciary oversight duty and red-flags/information-system theories
  facts_summary: "Derivative plaintiffs asserted oversight and loyalty claims against McDonald's former Global Chief People Officer David Fairhurst arising from sexual-harassment and misconduct risks."
