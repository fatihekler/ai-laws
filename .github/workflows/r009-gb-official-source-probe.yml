name: AI-LAWS R009 UK exact policy-source probe

on:
  push:
    paths:
      - '.github/workflows/r009-gb-official-source-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact current UK AI policy and regulator pages
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request,json,re,html
          UA={'User-Agent':'Mozilla/5.0 AI-LAWS-R009','Accept':'application/json,text/html,*/*'}
          def fetch(url,timeout=25):
              req=urllib.request.Request(url,headers=UA)
              with urllib.request.urlopen(req,timeout=timeout) as r:
                  return r.status,r.geturl(),r.headers.get('Content-Type',''),r.read()
          def plain(s): return re.sub(r'\s+',' ',html.unescape(re.sub(r'<[^>]+>',' ',s or ''))).strip()
          paths={
            'GB-009':'/government/calls-for-evidence/ai-growth-lab',
            'GB-009R':'/government/publications/response-to-the-ai-growth-lab-call-for-evidence',
            'GB-010':'/government/publications/regulators-strategic-approaches-to-ai',
            'GB-POLICY-REG-ACTION':'/government/publications/a-new-approach-to-ensure-regulators-and-regulation-support-growth',
            'GB-POLICY-AIAP-RESP':'/government/publications/ai-opportunities-action-plan-government-response',
          }
          for sid,p in paths.items():
              print('\n===',sid,p,'===')
              try:
                  s,f,ct,b=fetch('https://www.gov.uk/api/content'+p)
                  o=json.loads(b.decode('utf-8','ignore')); d=o.get('details') or {}; body=d.get('body') or d.get('description') or ''
                  markers={m:(m.lower() in plain(body).lower()) for m in ['AI Growth Lab','artificial intelligence','regulator','regulation','legislation','sandbox','statutory','legal']}
                  out={
                    'status':s,'title':o.get('title'),'document_type':o.get('document_type'),'first_published_at':o.get('first_published_at'),'public_updated_at':o.get('public_updated_at'),'withdrawn_notice':o.get('withdrawn_notice'),'base_path':o.get('base_path'),'markers':markers
                  }
                  print(json.dumps(out,ensure_ascii=False))
                  print('BODY_HEAD=',plain(body)[:2500])
              except Exception as e: print('ERROR=',type(e).__name__,str(e))

          print('\n=== ICO AI HUB ===')
          u='https://ico.org.uk/for-organisations/uk-gdpr-guidance-and-resources/artificial-intelligence/'
          try:
              s,f,ct,b=fetch(u); raw=b.decode('utf-8','ignore'); p=plain(raw)
              title=re.findall(r'<title[^>]*>(.*?)</title>',raw,re.I|re.S)
              print('STATUS=',s,'FINAL=',f,'TITLE=',plain(title[0]) if title else '')
              for m in ['Guidance on AI and data protection','Explaining decisions made with AI','UK GDPR','Data Protection Act 2018','Data (Use and Access) Act 2025']:
                  print('MARKER',m,m.lower() in p.lower())
          except Exception as e: print('ICO_ERROR=',type(e).__name__,str(e))
          PY
          echo 'ZIP_OR_ARTIFACT_CREATED=NO'
