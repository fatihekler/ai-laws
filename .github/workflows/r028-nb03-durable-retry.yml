name: AI-LAWS R028 NB03 durable retry

on:
  push:
    paths:
      - '.github/workflows/r028-nb03-durable-retry.yml'

permissions:
  contents: write

jobs:
  persist:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install verification tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils curl

      - name: Re-run verified R028 generator
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          src=Path('.github/workflows/r028-nb03-durable-state.yml').read_text(encoding='utf-8').splitlines()
          start=next((i+1 for i,line in enumerate(src) if line.strip()=="python3 - <<'PY'"),None)
          if start is None:
              raise SystemExit('R028 generator start marker not found')
          end=next((i for i in range(start,len(src)) if src[i].strip()=='PY'),None)
          if end is None:
              raise SystemExit('R028 generator end marker not found')
          code=textwrap.dedent('\n'.join(src[start:end]))+'\n'
          exec(compile(code,'r028-durable-generator.py','exec'),{'__name__':'__main__'})

          # Normalize only whitespace introduced by this R028 generator.
          ctx=Path('00_CONTROL/CURRENT_CONTEXT_AND_NEXT_ACTION.md')
          lines=ctx.read_text(encoding='utf-8').splitlines()
          for i,line in enumerate(lines):
              if line.startswith('**STATE:**') and 'R028_NB03_REPOSITORY_PDF_VALIDATION_COMPLETE' in line:
                  lines[i]=line.rstrip()
          ctx.write_text('\n'.join(lines)+'\n',encoding='utf-8')

          close=Path('86_NOTEBOOKLM/acquisition_runs/AI-LAWS-R028_NB03_REPOSITORY_PDF_VALIDATION_CLOSEOUT_2026-09-14.md')
          close_lines=[line.rstrip() for line in close.read_text(encoding='utf-8').splitlines()]
          close.write_text('\n'.join(close_lines)+'\n',encoding='utf-8')
          PY

      - name: Commit R028 durable state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            86_NOTEBOOKLM/downloads/NB03_CONTENT_IDENTITY_RESULTS.csv \
            86_NOTEBOOKLM/downloads/DOWNLOADS_REGISTRY.csv \
            86_NOTEBOOKLM/NOTEBOOKLM_ACQUISITION_AND_VALIDATION_LEDGER.csv \
            86_NOTEBOOKLM/downloads/NOTEBOOK_UPLOAD_PLAN.md \
            86_NOTEBOOKLM/NOTEBOOKLM_DOWNLOAD_AND_UPLOAD_LIST.md \
            86_NOTEBOOKLM/acquisition_runs/AI-LAWS-R028_NB03_REPOSITORY_PDF_VALIDATION_CLOSEOUT_2026-09-14.md \
            90_RESEARCH_QUEUE/INITIAL_RESEARCH_QUEUE.csv \
            00_CONTROL/CURRENT_CONTEXT_AND_NEXT_ACTION.md
          git diff --cached --check
          git commit -m 'validation(r028): persist NB03 repository PDF verification'
          git push origin HEAD:main

      - name: Confirm no artifact
        run: |
          echo 'ZIP_OR_ARTIFACT_CREATED=NO'
          echo 'NOTEBOOK_UPLOAD_COUNT=0'
          echo 'DERIVED_MARKDOWN_CREATED=0'
