name: AI-LAWS R026 NB04 PDF inspection

on:
  push:
    paths:
      - '.github/workflows/r026-nb04-pdf-inspect.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PDF inspection tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils

      - name: Inspect NB04 repository PDFs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r026/renders /tmp/r026/pages
          python3 - <<'PY'
          import csv, hashlib, os, re, subprocess
          from pathlib import Path

          root = Path('86_NOTEBOOKLM/downloads')
          docs = [
              ('TR-001', 'TÜRKİYE CUMHURİYETİ ANAYASASI.pdf', '2709', 'TÜRKİYE CUMHURİYETİ ANAYASASI'),
              ('TR-002', 'KİŞİSEL VERİLERİN KORUNMASI KANUNU.pdf', '6698', 'KİŞİSEL VERİLERİN KORUNMASI KANUNU'),
              ('TR-003', 'TÜRK BORÇLAR KANUNU.pdf', '6098', 'TÜRK BORÇLAR KANUNU'),
              ('TR-004', 'TÜRK MEDENİ KANUNU.pdf', '4721', 'TÜRK MEDENİ KANUNU'),
              ('TR-005', 'TÜRK CEZA KANUNU.pdf', '5237', 'TÜRK CEZA KANUNU'),
              ('TR-006', 'TÜKETİCİNİN KORUNMASI HAKKINDA KANUN.pdf', '6502', 'TÜKETİCİNİN KORUNMASI HAKKINDA KANUN'),
              ('TR-007', 'İNTERNET ORTAMINDA YAPILAN YAYINLARIN DÜZENLENMESİ VE BU YAYINLAR YOLUYLA İŞLENEN SUÇLARLA MÜCADELE EDİLMESİ HAKKINDA KANUN .pdf', '5651', 'İNTERNET ORTAMINDA YAPILAN YAYINLARIN DÜZENLENMESİ'),
              ('TR-008', 'SİBER GÜVENLİK KANUNU.pdf', '7545', 'SİBER GÜVENLİK KANUNU'),
          ]

          out = Path('/tmp/r026/report.csv')
          fields = [
              'source_id','filename','sha256','byte_size','pages','pdf_version','producer',
              'text_chars','text_searchable','expected_law_no_found','expected_title_found',
              'first_page_chars','last_page_chars','mentions_2026','mentions_7590',
              'mentions_31_7_2026','mentions_gecici_madde_2','mentions_madde_6','mentions_madde_16'
          ]
          rows = []

          def norm(s):
              return re.sub(r'\s+', ' ', s).strip()

          for sid, name, lawno, title in docs:
              path = root / name
              if not path.exists():
                  raise SystemExit(f'MISSING: {path}')
              data = path.read_bytes()
              sha = hashlib.sha256(data).hexdigest()
              size = len(data)
              info = subprocess.check_output(['pdfinfo', str(path)], text=True, errors='replace')
              meta = {}
              for line in info.splitlines():
                  if ':' in line:
                      k,v = line.split(':',1)
                      meta[k.strip()] = v.strip()
              pages = int(meta.get('Pages','0'))
              full = subprocess.check_output(['pdftotext','-layout',str(path),'-'], text=True, errors='replace')
              first = subprocess.check_output(['pdftotext','-layout','-f','1','-l','1',str(path),'-'], text=True, errors='replace')
              last = subprocess.check_output(['pdftotext','-layout','-f',str(pages),'-l',str(pages),str(path),'-'], text=True, errors='replace') if pages else ''
              nfull = norm(full).upper()
              ntitle = norm(title).upper()
              row = {
                  'source_id': sid,
                  'filename': name,
                  'sha256': sha,
                  'byte_size': size,
                  'pages': pages,
                  'pdf_version': meta.get('PDF version',''),
                  'producer': meta.get('Producer',''),
                  'text_chars': len(full),
                  'text_searchable': 'YES' if len(full.strip()) > 500 else 'NO',
                  'expected_law_no_found': 'YES' if lawno in full else 'NO',
                  'expected_title_found': 'YES' if ntitle in nfull else 'NO',
                  'first_page_chars': len(first.strip()),
                  'last_page_chars': len(last.strip()),
                  'mentions_2026': full.count('2026'),
                  'mentions_7590': full.count('7590'),
                  'mentions_31_7_2026': full.count('31/7/2026') + full.count('31.07.2026') + full.count('31 Temmuz 2026'),
                  'mentions_gecici_madde_2': len(re.findall(r'GEÇİCİ\s+MADDE\s+2', nfull)),
                  'mentions_madde_6': len(re.findall(r'MADDE\s+6\s*[-–—]', nfull)),
                  'mentions_madde_16': len(re.findall(r'MADDE\s+16\s*[-–—]', nfull)),
              }
              rows.append(row)
              Path(f'/tmp/r026/pages/{sid}_first.txt').write_text(first, encoding='utf-8')
              Path(f'/tmp/r026/pages/{sid}_last.txt').write_text(last, encoding='utf-8')
              subprocess.check_call(['pdftoppm','-png','-r','90','-f','1','-l','1','-singlefile',str(path),f'/tmp/r026/renders/{sid}_first'], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              subprocess.check_call(['pdftoppm','-png','-r','90','-f',str(pages),'-l',str(pages),'-singlefile',str(path),f'/tmp/r026/renders/{sid}_last'], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)

              if sid == 'TR-008':
                  contexts = []
                  for m in re.finditer(r'7590|GEÇİCİ\s+MADDE\s+2|31/7/2026|31\.07\.2026', full, flags=re.I):
                      a=max(0,m.start()-260); b=min(len(full),m.end()+420)
                      contexts.append(norm(full[a:b]))
                  Path('/tmp/r026/TR-008_critical_contexts.txt').write_text('\n---\n'.join(contexts), encoding='utf-8')

          with out.open('w', newline='', encoding='utf-8') as f:
              w = csv.DictWriter(f, fieldnames=fields)
              w.writeheader(); w.writerows(rows)

          print('=== R026 REPORT CSV ===')
          print(out.read_text(encoding='utf-8'))
          print('=== TR-008 CRITICAL CONTEXTS ===')
          c = Path('/tmp/r026/TR-008_critical_contexts.txt')
          print(c.read_text(encoding='utf-8') if c.exists() else 'NONE')
          print('=== FIRST/LAST PAGE TEXT ===')
          for sid, *_ in docs:
              print(f'--- {sid} FIRST ---')
              print(Path(f'/tmp/r026/pages/{sid}_first.txt').read_text(encoding='utf-8')[:2500])
              print(f'--- {sid} LAST ---')
              print(Path(f'/tmp/r026/pages/{sid}_last.txt').read_text(encoding='utf-8')[-2500:])
          PY

      - name: Upload inspection artifact
        uses: actions/upload-artifact@v4
        with:
          name: r026-nb04-pdf-inspection
          path: /tmp/r026/
          retention-days: 1
