## 1. Bounded scope

R012 creates a source-backed comparative liability grammar for AI actors without inventing a global liability rule. The bounded positive-law comparison is intentionally narrow:

- European Union: controlled `EU-001` AI Act, `EU-003` Product Liability Directive and `EU-005` GDPR;
- United States: controlled federal executive/OMB/NIST sources plus the already pinned Utah Chapter 72 Section 101 current-source anchor, used mainly to mark what the controlled source set does **not** establish about private civil liability.

Türkiye R005/R006 blockers are not reopened. R019 incident intake is not started. Other jurisdictions remain outside this bounded unit.

## 2. Source/currentness state

The repository snapshots for `EU-001`, `EU-003` and `EU-005` were previously verified as exact official EUR-Lex PDF byte matches. R012 re-extracted liability-relevant provisions from those exact repository snapshots.

