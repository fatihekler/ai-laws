name: R020 final reconciliation cleanup

on:
  push:
    paths:
      - '.github/workflows/r020-temporary-requirement-candidates.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact trigger state
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail closed on drift
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"

      - name: Reconcile controlled state
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/r020_reconcile.py
          git diff --check

      - name: Commit reconciliation cleanup and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Fatih Mehmet Ekler'
          git config user.email '5189511+fatihekler@users.noreply.github.com'
          git rm .github/workflows/r020-temporary-requirement-candidates.yml .github/scripts/r020_validate_candidates.py .github/scripts/r020_reconcile.py
          git add 00_CONTROL/CURRENT_CONTEXT_AND_NEXT_ACTION.md 90_RESEARCH_QUEUE/INITIAL_RESEARCH_QUEUE.csv 95_RESEARCH/CROSS_REPO_REQUIREMENTS/AI-LAWS-R020_CLOSEOUT_2026-09-14.md
          git diff --cached --check
          git commit -m 'control(r020): reconcile state and cleanup helpers'
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git push origin HEAD:main
          printf 'FINAL_HEAD=%s\nFINAL_TREE=%s\nWORKFLOW_PRESENT=%s\nVALIDATOR_PRESENT=%s\nRECONCILE_PRESENT=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" "$(test -e .github/workflows/r020-temporary-requirement-candidates.yml && echo YES || echo NO)" "$(test -e .github/scripts/r020_validate_candidates.py && echo YES || echo NO)" "$(test -e .github/scripts/r020_reconcile.py && echo YES || echo NO)"
