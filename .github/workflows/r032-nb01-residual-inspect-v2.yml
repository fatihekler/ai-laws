name: AI-LAWS R032 exact UN source resolver

on:
  push:
    paths:
      - '.github/workflows/r032-nb01-residual-inspect-v2.yml'

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils curl file
      - name: Resolve A/RES/79/1 official endpoints
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, re, subprocess, urllib.parse
          from pathlib import Path

          def sh(cmd):
              return subprocess.check_output(cmd, text=True, errors='replace').strip()
          def sha(b): return hashlib.sha256(b).hexdigest()
          def fetch(url, stem, headers=None):
              p=Path('/tmp')/stem
              cmd=['curl','-L','--silent','--show-error','--connect-timeout','20','--max-time','120','--retry','2','--retry-delay','2','-A','Mozilla/5.0 AI-LAWS source verification']
              if headers:
                  for h in headers: cmd += ['-H',h]
              cmd += ['-o',str(p),'-w','%{http_code}|%{content_type}|%{url_effective}',url]
              cp=subprocess.run(cmd,text=True,capture_output=True)
              b=p.read_bytes() if p.exists() else b''
              mime=sh(['file','-b','--mime-type',str(p)]) if b else 'NONE'
              print(f'FETCH|{stem}|url={url}|rc={cp.returncode}|curl={cp.stdout.strip()}|mime={mime}|bytes={len(b)}|sha256={sha(b) if b else "NONE"}')
              return cp.stdout.strip(), b, p, mime

          symbol='A/RES/79/1'
          enc=urllib.parse.quote(symbol, safe='')
          candidates=[
              f'https://docs.un.org/api/symbol/access?s={enc}&l=en&t=pdf',
              f'https://docs.un.org/api/symbol/access?s={enc}&l=en&t=PDF',
              f'https://docs.un.org/api/symbol/access?l=en&s={enc}&t=pdf',
              f'https://docs.un.org/api/symbol/access?s={enc}&l=en',
              f'https://docs.un.org/en/{symbol}',
              f'https://docs.un.org/{symbol}',
              f'https://undocs.org/{symbol}',
              f'https://undocs.org/en/{symbol}',
          ]
          seen=[]
          for i,u in enumerate(candidates,1):
              meta,b,p,mime=fetch(u,f'cand-{i}',headers=['Accept: application/pdf,text/html;q=0.9,*/*;q=0.8'])
              if mime=='application/pdf':
                  info=sh(['pdfinfo',str(p)])
                  txt=sh(['pdftotext','-layout',str(p),'-'])
                  pages=re.search(r'^Pages:\s+(\d+)',info,re.M)
                  print(f'PDF|{i}|pages={pages.group(1) if pages else "UNKNOWN"}|textchars={len(txt)}|symbol={"YES" if symbol in txt else "NO"}|pact={"YES" if "Pact for the Future" in txt else "NO"}|gdc={"YES" if "Global Digital Compact" in txt else "NO"}|head={" ".join(txt.split())[:1000]}')
              else:
                  text=b.decode('utf-8','replace')
                  vis=' '.join(re.sub(r'<[^>]+>',' ',text).split())
                  print(f'HTML|{i}|symbol={"YES" if symbol in vis or symbol in text else "NO"}|head={vis[:700]}')
                  for src in re.findall(r'''(?:src|href)=["']([^"']+)["']''',text,flags=re.I):
                      full=urllib.parse.urljoin(meta.split('|')[-1] if '|' in meta else u,src)
                      if any(k in full.lower() for k in ['api','document','symbol','pdf','.js']):
                          if full not in seen:
                              seen.append(full)
                              print('LINK|'+full)
          # Inspect linked JS bundles for likely API endpoints.
          for j,u in enumerate([x for x in seen if '.js' in x.lower()][:12],1):
              meta,b,p,mime=fetch(u,f'js-{j}')
              text=b.decode('utf-8','replace')
              hits=[]
              for pat in [r'/api/[A-Za-z0-9_?=&./%-]+',r'https?://[^"\'\s]+',r'symbol/access[^"\'\s]+']:
                  for m in re.findall(pat,text):
                      if ('symbol' in m.lower() or 'document' in m.lower() or 'pdf' in m.lower()) and m not in hits:
                          hits.append(m)
              for h in hits[:40]: print(f'JS_HIT|{j}|{h}')
          print('ZIP_OR_ARTIFACT_CREATED=NO')
          print('REPOSITORY_MUTATION_BY_INSPECTION_JOB=NO')
          PY
