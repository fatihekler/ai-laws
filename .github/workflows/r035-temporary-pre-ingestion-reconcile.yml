name: R035 pre-ingestion reconciliation

on:
  push:
    paths:
      - '.github/workflows/r035-temporary-pre-ingestion-reconcile.yml'
      - '.github/scripts/r035_pre_ingestion_reconcile.py'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact trigger state
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail closed on drift
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 7215486927a66ef8c5c1ded0877b3df2b76140d1 "$GITHUB_SHA"

      - name: Verify and reconcile pre-ingestion state
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/r035_pre_ingestion_reconcile.py
          git diff --check
          test "$(find 86_NOTEBOOKLM/downloads -maxdepth 1 -type f -iname '*.pdf' | wc -l)" -eq 38
          test -f 86_NOTEBOOKLM/NOTEBOOK_UPLOAD_SELECTION.csv
          test -f 86_NOTEBOOKLM/downloads/PRE_INGESTION_VERIFICATION.csv
          grep -q 'INC001_EXACT_BYTE_MATCH = YES' 95_RESEARCH/NOTEBOOK_READINESS/AI-LAWS-R035_CLOSEOUT_2026-09-14.md
          test -z "$(git diff --name-only -- '*.pdf')"

      - name: Commit durable results and remove temporary helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Fatih Mehmet Ekler'
          git config user.email '5189511+fatihekler@users.noreply.github.com'
          git rm .github/workflows/r035-temporary-pre-ingestion-reconcile.yml .github/scripts/r035_pre_ingestion_reconcile.py
          git add -A 00_CONTROL 86_NOTEBOOKLM 90_RESEARCH_QUEUE 95_RESEARCH
          git diff --cached --check
          test -z "$(git diff --cached --name-only -- '*.pdf')"
          git commit -m 'support(r035): reconcile pre-ingestion sources and upload selection'
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git push origin HEAD:main
          printf 'FINAL_HEAD=%s\nFINAL_TREE=%s\nWORKFLOW_PRESENT=%s\nSCRIPT_PRESENT=%s\n' \
            "$(git rev-parse HEAD)" \
            "$(git rev-parse HEAD^{tree})" \
            "$(test -e .github/workflows/r035-temporary-pre-ingestion-reconcile.yml && echo YES || echo NO)" \
            "$(test -e .github/scripts/r035_pre_ingestion_reconcile.py && echo YES || echo NO)"
